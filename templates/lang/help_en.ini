; Help texts, English. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is enclosed in double quotes and contains none itself; markup
; stays raw because the help is printed unescaped. Attributes are quoted
; with SINGLE quotes.

[HILFE]
K01 = "Marstek Venus E"
K02 = "Connects <b>MARSTEK Venus E</b> batteries to Loxone locally — without any cloud. Up to <b>4 devices</b> of the Venus E series are supported: Venus E Gen 3.0 (5.12 kWh) and the <b>Venus E Mini</b> (2 kWh), mixed installations included."
K03 = "Loxone is the energy manager: the plugin delivers status (state of charge, power, temperature, firmware, response time) and an hourly spot-price ranking (aWATTar); the Miniserver decides and sends power setpoints in passive mode — with two safety nets: the watchdog inside the setpoint stops the battery if Loxone fails, and the optional <b>auto fallback</b> then hands control back to the device's own auto mode."
K04 = "Compatible with LoxBerry 3.x and <b>LoxBerry 4</b> (pure PHP, runs on PHP 7.4 and 8.x)."
K05 = "Features"
K06 = "Status, passive setpoint (+ = charge, − = discharge) and handing control back, over the local UDP JSON API (port 30000), with a cache to protect the devices"
K07 = "<b>Multi-device operation</b>: up to 4 batteries, selected by device number, each with its own power limits and capacity (important for the Venus E Mini)"
K08 = "<b>State-of-charge history</b> as a chart in the plugin interface — with a day selector, battery power as a second curve and a CSV export per day"
K09 = "<b>Failure detection</b>: during a fault the last measured values stay put instead of dropping to zero, and the field ALTER says how old they are. The heartbeat MARSTEK_STATUS_ZAEHLER advances by one on every minute task — if it stops, everything else is frozen."
K10 = "<b>Setpoint acknowledgement</b>: SOLL is the setpoint the device last accepted, SOLLALTER its age, and FBREST the time remaining until the auto fallback"
K11 = "<b>Modbus TCP (optional, read only)</b>: from firmware 144 the Venus E Gen 3.0 can be read directly over the LAN cable (port 502, no RS485 adapter) — it delivers the device's own kWh meters, the cycle counter and the efficiency. Control deliberately stays on the UDP API because only its passive mode has a watchdog."
K12 = "<b>Daily balance</b>: the device resets its own daily and monthly counters. The plugin therefore records the daily closing values itself — a day without a measurement does not get a zero row."
K13 = "Hourly spot-price ranking for the next 24 hours (aWATTar Germany and Austria), plus cheapest and most expensive hour, spread, price of the next hour and the number of hours until the lowest price. VAT and a surcharge in ct/kWh can be configured."
K14 = "Optional MQTT publishing through the LoxBerry MQTT gateway — status, energy meters, spot-price ranks and the heartbeat. The MQTT tab lists every published topic with its meaning."
K15 = "Connected to the LoxBerry health check and to the notification centre. Configuration, history and log survive updates and even a fresh installation."
K16 = "Requirements"
K17 = "The local API has to be enabled once on every device — in the Marstek app or over Bluetooth through https://rweijnen.github.io/marstek-venus-monitor/. The default port is 30000."
K18 = "Recent device firmware. The local API matures with the updates."
K19 = "<b>Firmware quirk</b>: some firmware versions answer only to broadcast packets instead of unicast — the plugin detects and uses that automatically. The broadcast is the only place that needs the PHP extension sockets; without it unicast, Modbus and MQTT still work, only the broadcast and the device search are unavailable. With several Venus devices on the same network, broadcast commands reach all of them."
K20 = "Endpoints for Loxone"
K21 = "Call"
K22 = "Purpose"
K23 = "status"
K24 = "State of charge, battery power, temperature, grid power, firmware, response time, age of the measurement, heartbeat, setpoint and time remaining until the auto fallback"
K25 = "ranks"
K26 = "Rank of the current hour within the 24-hour window, price, negative-price flag, cheapest and most expensive hour, spread, price of the next hour, hours until the lowest and highest price, and the reason when data is missing"
K27 = "energy"
K28 = "The device's own kWh meters over Modbus TCP: charged and discharged, total, day and month, plus cycles and efficiency"
K29 = "summe"
K30 = "All batteries together, state of charge weighted by capacity. If the capacity is missing for one battery, or one does not answer, the result is -1 instead of a partial sum."
K31 = "p and mode"
K32 = "Set the power setpoint and hand control back to the battery. Both require the token; appending dry=1 computes everything and sends nothing."
K33 = "selftest and diag"
K34 = "Check the token without touching the battery, and try the connection paths one by one. Both require the token."
K35 = "All outputs stay backwards compatible with single-device installations — without a device number, device 1 is always addressed. Since 1.1.0 the fields a record carries are defined in exactly one place in the code; the answer line, the Loxone template, the MQTT topic list and the tables in the interface are all built from it."
K36 = "Interface"
K37 = "Five tabs: <b>Settings</b> (device table with capacity, power limits, cache, auto fallback, history retention, master switch, protection thresholds, notifications, market, VAT and surcharge, backup and restore), <b>MQTT</b> (checkbox, prefix, subscription note depending on the gateway version and the table of every published topic), <b>Loxone integration</b> (step by step, with a numbered block list and a cross-check), <b>Test</b> (self-check, device search, technical information, dry run, switching) and <b>Log files</b>. Above the tabs: a status line and the history chart per device."
K38 = "When something does not work"
K39 = "The <b>Test</b> tab is the first place to look. Without Loxone it answers whether the configuration is intact, whether the minute task is running, whether the batteries answer, whether the plugin's own endpoint is reachable through 127.0.0.1, whether the MQTT gateway is up and whether all templates are well-formed. A dot there means <b>does not apply</b>, not <b>I do not know</b> — uncertainty is a cross. If the self-check finds nothing, the <b>Diagnosis</b> button helps: it tries unicast, broadcast and Modbus one by one and says which path works."
K40 = "Privacy"
K41 = "The plugin contains <b>no personal data</b> — IP addresses and all settings live exclusively in the local configuration under config/plugins/marstekvenus/marstek.json. The only external connection goes to the aWATTar price API, and it is fetched without any identifier."
