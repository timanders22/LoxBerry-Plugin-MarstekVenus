; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Marstek Venus E"
K02 = "Connects <b>MARSTEK Venus E</b> batteries to Loxone locally — without the cloud. Up to <b>4 devices</b> of the Venus E series are supported: Venus E gen 3.0 (5.12 kWh) and the <b>Venus E Mini</b> (2 kWh), mixed if you like."
K03 = "Loxone is the energy manager: the plugin supplies the state (SOC, power, temperature, firmware, response time) and a spot-hour ranking (aWATTar), the Miniserver decides and sends power set points in passive mode — with a double safety net: the watchdog in the set point stops the battery if Loxone fails, and the optional <b>auto fallback</b> then hands control back to the device's own automatic mode."
K04 = "Compatible with LoxBerry 3.x and <b>LoxBerry 4</b> (pure PHP, runs with PHP 7.4 and 8.x)."
K05 = "Features"
K06 = "State, passive set point (+ = charge, − = discharge) and mode feedback through the local UDP JSON API (port 30000), with a cache to protect the devices"
K07 = "<b>Multi-device operation</b>: up to 4 batteries, selected with <code>&amp;dev=N</code> (default 1), individual power limits per device (important with the Venus E Mini)"
K08 = "<b>SOC over the day</b> as a small chart in the plugin interface (a per-minute cron collects the measurements automatically, kept for 8 days)"
K09 = "<b>Firmware and response time</b> shown in the state (also as <code>FW=</code>/<code>MS=</code> fields for Loxone and through MQTT)"
K10 = "<b>Auto fallback</b>: if no set point arrives for X minutes, the device switches to automatic mode by itself (0 = off)"
K11 = "<b>Modbus TCP (optional, read-only)</b>: Venus E gen 3.0 from firmware 144 onwards directly over the LAN cable (port 502, no RS485 adapter) — supplies the device's kWh counters (charged/discharged total/day/month), cycle counter and efficiency (<code>?energy</code>). Control deliberately stays on the UDP API, because only its passive mode has a watchdog"
K12 = "Spot-hour ranking for the next 24 h (aWATTar DE/AT, VAT factor adjustable): <code>RANK</code> (1 = cheapest hour), <code>RANKD</code> (1 = most expensive), <code>NEG</code>, <code>CURP</code>"
K13 = "Optional MQTT publishing through the LoxBerry MQTT gateway — status, energy counters (<code>energie_*</code>) and spot price ranks (<code>rang_*</code>)"
K14 = "The configuration and log survive plugin updates and even a reinstallation (a backup copy outside the plugin folder)"
K15 = "Prerequisites"
K16 = "Enable the local API once on each device (Marstek app or https://rweijnen.github.io/marstek-venus-monitor/ over Bluetooth), UDP port 30000."
K17 = "Current device firmware (the local API matures with the updates)."
K18 = "<b>Firmware quirk</b>: some firmware versions (Venus E 3.0 with FW 148, for example) only answer <b>broadcast</b> packets rather than unicast — the plugin detects and uses that automatically. The „Test“ tab contains a <b>diagnosis</b> (unicast/broadcast/Modbus self-test) for quick troubleshooting. Note: with several Venus devices on the same network, broadcast commands reach all of them — in that case all should run a firmware that answers unicast."
K19 = "Endpoints (for Loxone)"
K20 = "All outputs are backwards compatible with single-device installations — without <code>&amp;dev=</code> device 1 is always addressed."
K21 = "Interface"
K22 = "Tabs <b>Settings</b> (device table, power limits, state cache, auto fallback, aWATTar market and VAT factor, MQTT), <b>Loxone integration</b> (a step-by-step guide for non-experts including command recognition and the recommended logic), <b>Test</b> (state/idle/auto per device, spot ranking) and <b>Log files</b>. Above the tabs: a status line and the SOC chart per device."
K23 = "Privacy"
K24 = "The plugin contains <b>no personal data</b> — IP addresses and all settings are kept exclusively in the local configuration (<code>config/plugins/marstekvenus/marstek.json</code>). The only external connection is to the aWATTar price API (without any identifier)."
K25 = "Call"
K26 = "Purpose"
K27 = "<code>/plugins/marstekvenus/marstek.php?status[&amp;dev=N]</code>"
K28 = "<code>MARSTEK;OK=..;SOC=..;BATP=..;TEMP=..;GRIDP=..;FW=..;MS=..</code> (BATP: + = charging)"
K29 = "<code>/plugins/marstekvenus/marstek.php?ranks</code>"
K30 = "<code>RANKS;OK=..;N=..;RANK=..;RANKD=..;CURP=..;NEG=..</code>"
K31 = "<code>/plugins/marstekvenus/marstek.php?p=WATT&amp;t=SEK[&amp;dev=N]</code>"
K32 = "Passive set point (+ = charge, − = discharge, 0 = idle; t = watchdog)"
K33 = "<code>/plugins/marstekvenus/marstek.php?mode=auto|ai[&amp;dev=N]</code>"
K35 = "Hand control back to the battery"
K36 = "<code>/plugins/marstekvenus/marstek.php?energy[&amp;dev=N]</code>"
K37 = "<code>ENERGY;OK=..;CHGT=..;DIST=..;CHGD=..;DISD=..;CHGM=..;DISM=..;CYC=..;EFF=..</code> (Modbus TCP, has to be enabled per device)"
