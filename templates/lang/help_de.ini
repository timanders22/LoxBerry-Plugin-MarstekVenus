; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben. Attribute werden EINFACH quotiert.

[HILFE]
K01 = "Marstek Venus E"
K02 = "Bindet <b>MARSTEK Venus E</b> Batteriespeicher lokal — ohne Cloud — an Loxone an. Unterstützt werden bis zu <b>4 Geräte</b> der Venus-E-Serie: Venus E Gen 3.0 (5,12 kWh) und der <b>Venus E Mini</b> (2 kWh), gemischt möglich."
K03 = "Loxone ist der Energiemanager: Das Plugin liefert Status (Ladezustand, Leistung, Temperatur, Firmware, Antwortzeit) und ein Spot-Stunden-Ranking (aWATTar), der Miniserver entscheidet und sendet Leistungs-Sollwerte im Passiv-Modus — mit doppeltem Sicherheitsnetz: Der Watchdog im Sollwert stoppt den Speicher, wenn Loxone ausfällt, und der optionale <b>Auto-Fallback</b> gibt danach die Regie an den Auto-Modus des Geräts zurück."
K04 = "Kompatibel mit LoxBerry 3.x und <b>LoxBerry 4</b> (reines PHP, läuft mit PHP 7.4 und 8.x)."
K05 = "Funktionen"
K06 = "Status, Passiv-Sollwert (+ = laden, − = entladen) und Modus-Rückgabe über die lokale UDP-JSON-API (Port 30000), mit Zwischenspeicher zum Schutz der Geräte"
K07 = "<b>Mehrgeräte-Betrieb</b>: bis zu 4 Speicher, Auswahl über die Gerätenummer, je Gerät eigene Leistungsgrenzen und Kapazität (wichtig beim Venus E Mini)"
K08 = "<b>SOC-Tagesverlauf</b> als Grafik in der Plugin-Oberfläche — mit Tagesauswahl, der Batterieleistung als zweiter Kurve und einer CSV-Ausfuhr je Tag"
K09 = "<b>Ausfallerkennung</b>: bei einer Störung bleiben die zuletzt gemessenen Werte stehen statt auf null zu fallen, und das Feld ALTER sagt, wie alt sie sind. Der Herzschlag MARSTEK_STATUS_ZAEHLER läuft bei jedem Minutentakt eine Stelle weiter — bleibt er stehen, ist alles Übrige eingefroren."
K10 = "<b>Soll-Ist-Quittung</b>: SOLL nennt den zuletzt vom Gerät angenommenen Sollwert, SOLLALTER sein Alter und FBREST die Restzeit bis zum Auto-Fallback"
K11 = "<b>Modbus TCP (optional, nur lesend)</b>: Venus E Gen 3.0 ab Firmware 144 direkt über das LAN-Kabel (Port 502, kein RS485-Adapter) — liefert die kWh-Zähler des Geräts, den Zyklenzähler und den Wirkungsgrad. Die Steuerung bleibt bewusst auf der UDP-API, weil nur deren Passiv-Modus einen Watchdog hat."
K12 = "<b>Tagesbilanz</b>: das Gerät setzt seine Tages- und Monatszähler selbst zurück. Das Plugin schreibt die Tagesabschlüsse deshalb fort — ein Tag ohne Messung bekommt dabei keine Nullzeile."
K13 = "Spot-Stunden-Ranking der nächsten 24 Stunden (aWATTar Deutschland und Österreich), dazu günstigste und teuerste Stunde, Spanne, Preis der nächsten Stunde und die Zahl der Stunden bis zum Tiefstpreis. Umsatzsteuer und Aufschlag in ct/kWh sind einstellbar."
K14 = "Optionales MQTT-Publish über das LoxBerry MQTT Gateway — Status, Energiezähler, Spotpreis-Ränge und der Takt. Der Reiter MQTT führt alle veröffentlichten Themen mit ihrer Bedeutung auf."
K15 = "Anschluss an den LoxBerry-Healthcheck und an das Benachrichtigungszentrum. Konfiguration, Verlauf und Protokoll überleben Updates und sogar eine Neuinstallation."
K16 = "Voraussetzungen"
K17 = "Die lokale API muss an jedem Gerät einmalig aktiviert werden — in der Marstek-App oder per Bluetooth über https://rweijnen.github.io/marstek-venus-monitor/. Standard-Port ist 30000."
K18 = "Aktuelle Geräte-Firmware. Die lokale API reift mit den Updates."
K19 = "<b>Firmware-Eigenheit</b>: Manche Firmwaren antworten nur auf Rundruf-Pakete statt auf Unicast — das Plugin erkennt und nutzt das automatisch. Der Rundruf ist die einzige Stelle, die die PHP-Erweiterung sockets braucht; fehlt sie, laufen Unicast, Modbus und MQTT trotzdem, nur Rundruf und Gerätesuche fallen aus. Bei mehreren Venus-Geräten im selben Netz erreichen Rundruf-Befehle alle Geräte."
K20 = "Endpunkte für Loxone"
K21 = "Aufruf"
K22 = "Zweck"
K23 = "status"
K24 = "Ladezustand, Batterieleistung, Temperatur, Netzleistung, Firmware, Antwortzeit, Alter der Messung, Herzschlag, Sollwert und Restzeit bis zum Auto-Fallback"
K25 = "ranks"
K26 = "Rang der laufenden Stunde im 24-Stunden-Fenster, Preis, Negativpreis-Merker, günstigste und teuerste Stunde, Spanne, Preis der nächsten Stunde, Stunden bis zum Tiefst- und Höchstpreis, Grund bei fehlenden Daten"
K27 = "energy"
K28 = "kWh-Zähler des Geräts über Modbus TCP: geladen und abgegeben, gesamt, Tag und Monat, dazu Zyklen und Wirkungsgrad"
K29 = "summe"
K30 = "Alle Speicher zusammen, Ladezustand nach Kapazität gewichtet. Fehlt bei einem Speicher die Kapazität oder antwortet einer nicht, kommt -1 statt einer Teilsumme."
K31 = "p und mode"
K32 = "Leistungs-Sollwert setzen und die Regie an den Speicher zurückgeben. Beides ist tokenpflichtig; ein angehängtes dry=1 rechnet alles fertig und sendet nichts."
K33 = "selftest und diag"
K34 = "Das Token prüfen, ohne den Speicher anzufassen, und die Verbindungswege einzeln durchprobieren. Beides ist tokenpflichtig."
K35 = "Alle Ausgaben sind abwärtskompatibel zu Ein-Geräte-Installationen — ohne Gerätenummer wird immer Gerät 1 angesprochen. Welche Felder ein Satz trägt, steht seit 1.1.0 an genau einer Stelle im Programmcode; Antwortzeile, Loxone-Vorlage, MQTT-Themenliste und die Tabellen in der Oberfläche entstehen daraus."
K36 = "Oberfläche"
K37 = "Fünf Reiter: <b>Einstellungen</b> (Gerätetabelle mit Kapazität, Leistungsgrenzen, Zwischenspeicher, Auto-Fallback, Verlaufsdauer, Hauptschalter, Schutzschwellen, Benachrichtigungen, Markt, Umsatzsteuer und Aufschlag, Sicherung und Rückspielen), <b>MQTT</b> (Haken, Präfix, Abo-Hinweis je nach Gateway-Fassung und die Tabelle aller veröffentlichten Themen), <b>Einbindung in Loxone</b> (Schritt für Schritt, mit durchnummerierter Baustein-Liste und Gegenprobe), <b>Test</b> (Selbstprüfung, Gerätesuche, technische Auskunft, Trockenlauf, Schalten) und <b>Logdateien</b>. Über den Reitern stehen Statuszeile und Verlaufsgrafik je Gerät."
K38 = "Wenn etwas nicht geht"
K39 = "Der Reiter <b>Test</b> ist die erste Anlaufstelle. Er beantwortet ohne Loxone, ob die Konfiguration heil ist, ob der Minutentakt läuft, ob die Speicher antworten, ob der eigene Endpunkt über 127.0.0.1 erreichbar ist, ob das MQTT-Gateway steht und ob alle Vorlagen wohlgeformt sind. Ein Punkt bedeutet dort <b>geht mich nichts an</b>, nicht <b>ich weiß es nicht</b> — Unklarheit ist ein Kreuz. Findet die Selbstprüfung nichts, hilft der Knopf <b>Diagnose</b>: er probiert Unicast, Rundruf und Modbus einzeln durch und sagt, welcher Weg trägt."
K40 = "Datenschutz"
K41 = "Es sind <b>keine persönlichen Daten</b> im Plugin enthalten — IP-Adressen und alle Einstellungen liegen ausschließlich in der lokalen Konfiguration unter config/plugins/marstekvenus/marstek.json. Externe Verbindungen gibt es nur zur aWATTar-Preis-API, und die wird ohne jede Kennung abgerufen."
