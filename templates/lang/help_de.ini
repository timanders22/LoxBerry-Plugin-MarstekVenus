; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Marstek Venus E"
K02 = "Bindet <b>MARSTEK Venus E</b> Batteriespeicher lokal — ohne Cloud — an Loxone an. Unterstützt werden bis zu <b>4 Geräte</b> der Venus-E-Serie: Venus E Gen 3.0 (5,12 kWh) und der <b>Venus E Mini</b> (2 kWh), gemischt möglich."
K03 = "Loxone ist der Energiemanager: Das Plugin liefert Status (SOC, Leistung, Temperatur, Firmware, Antwortzeit) und ein Spot-Stunden-Ranking (aWATTar), der Miniserver entscheidet und sendet Leistungs-Sollwerte im Passiv-Modus — mit doppeltem Sicherheitsnetz: Der Watchdog im Sollwert stoppt den Speicher, wenn Loxone ausfällt, und der optionale <b>Auto-Fallback</b> gibt danach die Regie an den Auto-Modus des Geräts zurück."
K04 = "Kompatibel mit LoxBerry 3.x und <b>LoxBerry 4</b> (reines PHP, läuft mit PHP 7.4 und 8.x)."
K05 = "Funktionen"
K06 = "Status, Passiv-Sollwert (+ = laden, − = entladen) und Modus-Rückgabe über die lokale UDP-JSON-API (Port 30000), mit Cache zum Schutz der Geräte"
K07 = "<b>Mehrgeräte-Betrieb</b>: bis zu 4 Speicher, Auswahl per <code>&amp;dev=N</code> (Standard 1), je Gerät eigene Leistungsgrenzen (wichtig beim Venus E Mini)"
K08 = "<b>SOC-Tagesverlauf</b> als Mini-Grafik in der Plugin-Oberfläche (Messpunkte sammelt ein minutlicher Cron automatisch, Aufbewahrung 8 Tage)"
K09 = "<b>Firmware- und Antwortzeit-Anzeige</b> im Status (auch als <code>FW=</code>/<code>MS=</code>-Felder für Loxone und per MQTT)"
K10 = "<b>Auto-Fallback</b>: kommt X Minuten kein Sollwert mehr, wechselt das Gerät selbsttätig in den Auto-Modus (0 = aus)"
K11 = "<b>Modbus TCP (optional, nur lesend)</b>: Venus E Gen 3.0 ab Firmware 144 direkt über das LAN-Kabel (Port 502, kein RS485-Adapter) — liefert die kWh-Zähler des Geräts (geladen/abgegeben gesamt/Tag/Monat), Zyklenzähler und Wirkungsgrad (<code>?energy</code>). Die Steuerung bleibt bewusst auf der UDP-API, weil nur deren Passiv-Modus einen Watchdog hat"
K12 = "Spot-Stunden-Ranking der nächsten 24 h (aWATTar DE/AT, USt-Faktor einstellbar): <code>RANK</code> (1 = günstigste Stunde), <code>RANKD</code> (1 = teuerste), <code>NEG</code>, <code>CURP</code>"
K13 = "Optionales MQTT-Publish über das LoxBerry MQTT Gateway"
K14 = "Konfiguration und Log überleben Plugin-Updates und sogar eine Neuinstallation (Sicherungskopie außerhalb des Plugin-Ordners)"
K15 = "Voraussetzungen"
K16 = "Lokale API an jedem Gerät einmalig aktivieren (Marstek-App bzw. https://rweijnen.github.io/marstek-venus-monitor/ per Bluetooth), UDP-Port 30000."
K17 = "Aktuelle Geräte-Firmware (die lokale API reift mit den Updates)."
K18 = "<b>Firmware-Eigenheit</b>: Manche Firmwaren (z. B. Venus E 3.0 mit FW 148) antworten nur auf <b>Broadcast</b>-Pakete statt auf Unicast — das Plugin erkennt und nutzt das automatisch. Der Reiter „Test“ enthält eine <b>Diagnose</b> (Unicast/Broadcast/Modbus-Selbsttest) zur schnellen Fehlersuche. Hinweis: Bei mehreren Venus-Geräten im selben Netz erreichen Broadcast-Befehle alle Geräte — dann sollten alle eine Firmware haben, die Unicast beantwortet."
K19 = "Endpunkte (für Loxone)"
K20 = "Alle Ausgaben sind abwärtskompatibel zu Ein-Geräte-Installationen — ohne <code>&amp;dev=</code> wird immer Gerät 1 angesprochen."
K21 = "Oberfläche"
K22 = "Reiter <b>Einstellungen</b> (Geräte-Tabelle, Leistungsgrenzen, Status-Cache, Auto-Fallback, aWATTar-Markt + USt-Faktor, MQTT), <b>Einbindung in Loxone</b> (Schritt-für-Schritt-Anleitung für Laien inkl. Befehlserkennungen und empfohlener Logik), <b>Test</b> (je Gerät Status/Leerlauf/Auto, Spot-Ranking) und <b>Logdateien</b>. Über den Reitern: Statuszeile und SOC-Tagesgrafik je Gerät."
K23 = "Datenschutz"
K24 = "Es sind <b>keine persönlichen Daten</b> im Plugin enthalten — IP-Adressen und alle Einstellungen liegen ausschließlich in der lokalen Konfiguration (<code>config/plugins/marstekvenus/marstek.json</code>). Externe Verbindungen gibt es nur zur aWATTar-Preis-API (ohne Kennung)."
K25 = "Aufruf"
K26 = "Zweck"
K27 = "<code>/plugins/marstekvenus/marstek.php?status[&amp;dev=N]</code>"
K28 = "<code>MARSTEK;OK=..;SOC=..;BATP=..;TEMP=..;GRIDP=..;FW=..;MS=..</code> (BATP: + = lädt)"
K29 = "<code>/plugins/marstekvenus/marstek.php?ranks</code>"
K30 = "<code>RANKS;OK=..;N=..;RANK=..;RANKD=..;CURP=..;NEG=..</code>"
K31 = "<code>/plugins/marstekvenus/marstek.php?p=WATT&amp;t=SEK[&amp;dev=N]</code>"
K32 = "Passiv-Sollwert (+ = laden, − = entladen, 0 = Leerlauf; t = Watchdog)"
K33 = "<code>/plugins/marstekvenus/marstek.php?mode=auto|ai[&amp;dev=N]</code>"
K35 = "Regie an den Speicher zurückgeben"
K36 = "<code>/plugins/marstekvenus/marstek.php?energy[&amp;dev=N]</code>"
K37 = "<code>ENERGY;OK=..;CHGT=..;DIST=..;CHGD=..;DISD=..;CHGM=..;DISM=..;CYC=..;EFF=..</code> (Modbus TCP, muss je Gerät aktiviert sein)"
