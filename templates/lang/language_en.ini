SEITE2_SCHRITT7 = "Save and send, switch on “Speicher-Regelung ein” in the app. Check: in sunshine the status shows “charging surplus”, and about 100 W of feed-in remain at your own meter; in the plugin, tab “Test”, “mqtt” appears under “Writers of the last 24 hours” (“loxone” on the HTTP path). If you have switched on “Reject foreign writers”, add “mqtt” to the allowed writers."
SEITE2_H9 = "<b>On no. 35:</b> since 1.1.26 the setpoint goes via MQTT like the buttons: publish marstek/befehl/sollwert &lt;v.0&gt; at the shared output “LoxBerry MQTT-Gateway”. It only takes effect with the ticks “Accept commands via MQTT” (tab MQTT) and “Control active” (tab Settings). The command bridge lets the same value through only once within 50 s; the change between S and S+1 therefore arrives every 30 s. The HTTP path (template “Marstek steuern Venus E” with action token) stays for existing installations."
SEITE2_H10 = "<b>On no. 37 and 38:</b> if a wallbox is charging, no. 38 credits its power to the surplus – the storage then does not discharge into the car. If the wallbox charges from PV surplus, the charge request no. 21 drops: the car has priority."
SEITE2_H11 = "<b>On no. 39 to 45:</b> if no setpoint reaches the storage for ten minutes with the control switched on (age of the setpoint above 300 s), no. 45 reports. The 600 s at no. 44 swallow the start-up and the silent windows of the storage."
SEITE2_H12 = "<b>On no. 46 to 62:</b> the saving counts discharging above the daily average and grid charging below it (prices from the plugin “Spotpreis aWATTar”; ct/kWh × W / 100000 = EUR/h); charging from PV does not count. On Mondays at 8 o’clock a push with the saving of the previous week arrives; the sum survives a power failure thanks to remanence."
SEITE3_SCHRITT6 = "Save and send. Check: compare “Strompreis jetzt (Marstek)” with tab “Test” → “Spot prices of all hours”."
SEITE3_H4 = "“Meters valid” and “age of the meter readings” arrive every minute; “meters valid” falls to 0 after 900 s without fresh readings (as at the HTTP endpoint). Prices and meter readings themselves arrive on change, at the latest every half hour."
SEITE3_H5 = "<b>On no. 31 to 37:</b> at 23:55 the analog memories take over the monthly values, but only with fresh meters; on the first of the month at 0:00 the push with the previous month arrives – by then the plugin has already set the monthly meters to 0."
