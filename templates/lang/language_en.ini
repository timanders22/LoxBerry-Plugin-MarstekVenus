[LOX]
H_EINBINDUNG = "Loxone integration — step by step"
GRUNDGEDANKE = "<b>Loxone is the energy manager, not the plugin.</b> The plugin delivers readings and prices, the Miniserver decides and sends power setpoints. Two safety nets sit underneath: the watchdog in the setpoint stops the battery when nothing arrives from Loxone any more, and the auto fallback then hands control back to the device's own auto mode."
SCHRITT = "Step %d"
S1_TITEL = "Choose the path"
S_ABO = "Enter the subscription in the MQTT gateway"
S_EINGAENGE = "Create the virtual inputs"
S1_TEXT = "<b>MQTT is the standard path.</b> It transmits by itself as soon as a new value exists and does not occupy an HTTP input thread of the Miniserver. The HTTP path below remains fully available and is equivalent — anyone who has already set it up need not change anything. Both paths carry the same values."
