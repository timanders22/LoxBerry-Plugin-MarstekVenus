VORLAGE_BEFEHLE_TEXT = "The setpoint and the Auto and AI buttons are available as a template: select Virtual Outputs → Predefined devices → import template (creates the output “Marstek MQTT-Befehle” at the address /dev/udp/&lt;LoxBerry&gt;/11884). <b>Import only once</b> – twice gives duplicate blocks."
SATZ_BEFEHLE_MQTT = "Setpoint and Auto/AI buttons (MQTT commands)"
SATZ_STEUERN_HTTP = "Setpoint (HTTP, with action token)"
ABO_V1_MQTT = "<b>Gateway version 1:</b> under <i>MQTT Gateway → Subscriptions</i> enter the line <span class='sm-mono'>%s/#</span> and save. Without this entry nothing arrives at the Miniserver. The plugin also announces the same subscription via its file mqtt_subscriptions.cfg; an own entry does no harm."
ABO_V2_MQTT = "<b>Gateway version 2:</b> under <i>MQTT Gateway → Subscriptions</i> the group <span class='sm-mono'>%s</span> appears by itself. Tick these data points (table below). For those marked ‘N’ also set ‘Noncached’: they often send the same value, and without the setting they are missing after a restart of the Miniserver until they change. Do not set ‘Reset after send’ on any data point: ‘storage reachable’ would otherwise fall to 0 after every value, and the page would report a fault."
HAKEN_TITEL = "Data points to tick (gateway version 2)"
HAKEN_SP_NAME = "Data point"
HAKEN_SP_THEMA = "Topic"
HAKEN_SP_NC = "Noncached"
HAKEN_ANZAHL = "%d data points, %d of them with ‘Noncached’ (N)."
HAKEN_NICHT = "Do not tick: zaehler, ts, takt_zaehler, takt_ts, status/ok and status/ts (no sample page needs them) and the command topics %s/befehl/… including the acknowledgements."
BEFEHLE_SOLL_TEXT = "<b>Setpoint of the control via MQTT (since 1.1.26):</b> the setpoint goes via MQTT like the buttons: <span class='sm-mono'>publish marstek/befehl/sollwert &lt;v.0&gt;</span> at the shared output “LoxBerry MQTT-Gateway” (table and template under “Setpoint and buttons via MQTT”). It needs the tick “Accept commands via MQTT” (tab MQTT) and “Control active” (tab Settings) in the plugin. With gateway version 1 the UDP input loses datagrams under load. The 30 s cycle absorbs that: the storage only stops after seven lost setpoints in a row. <b>For existing installations</b> the HTTP path stays: the virtual output with action token (template “Marstek steuern Venus E”) with these addresses."
BEFEHLE_MQTT_TEXT = "<b>Setpoint and buttons via MQTT:</b> Loxone sends <span class='sm-mono'>publish &lt;topic&gt; 1</span> (buttons) or <span class='sm-mono'>publish &lt;topic&gt; &lt;v.0&gt;</span> (setpoint) to the UDP input of the MQTT gateway (port %d); the command bridge of the plugin accepts the command, checks it and passes it to the same function as the HTTP path. With gateway version 1 and 2 nothing has to be entered or ticked for it. Never “retain” instead of “publish” – a retained command is discarded."
BEFEHLE_ZUSTAND_AN = "Accept commands via MQTT: switched on."
BEFEHLE_ZUSTAND_AUS = "Accept commands via MQTT: switched off (default) – switch it on in tab MQTT."
H_HTTP = "For existing installations: HTTP"
HTTP_TEXT = "If you have already imported the HTTP templates, nothing needs to change: the endpoint keeps delivering the same values. These inputs poll the plugin in the polling cycle and recognise their values by the command recognition. Create new ones only along the MQTT path above – both paths for the same container would give duplicate blocks."

