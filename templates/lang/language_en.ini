SATZ_RANKS = "Spot prices and ranks"
SATZ_ENERGY = "Energy meters (Modbus)"
SATZ_SUMME = "Sum across all batteries"
SATZ_STEUERN = "Control commands (virtual output)"
SP_EIGENSCHAFT = "Property"
SP_WERT = "Value"
SP_ADRESSE = "Address"
SP_TAKT = "Polling interval"
SP_SUCHTEXT = "Command recognition"
SP_EINHEIT = "Unit"
SP_BEDEUTUNG = "Meaning"
JE_GERAET = "For device 2 and up, create another virtual input with the same address and append dev=2 (%s&dev=2)."
S_AUSGANG = "Sending commands (virtual output)"
AUSGANG_TEXT = "The placeholder <span class='sm-mono'>&lt;v&gt;</span> is the desired power in watts: positive charges, negative discharges, 0 is idle. <span class='sm-mono'>t=240</span> is the watchdog — if no new command arrives, the battery stops by itself after 240 seconds. Send the setpoint again every 60 seconds. <b>Limits:</b> t is valid from 30 to 3600 seconds, p up to the power limit of the battery. Anything beyond is clamped, and the answer then carries <span class='sm-mono'>BEGRENZT=1</span>. <b>Command brake per battery:</b> the same setpoint (±1 W, same t) is not sent again within 60 s — the answer carries <span class='sm-mono'>UNVERAENDERT=1</span>; after 58 s at the latest it goes out again and renews the watchdog (with a small t after half of t). With the setting <b>minimum interval 10 s</b> (Settings tab, off by default) a different setpoint within 10 s is rejected with HTTP 429 and <span class='sm-mono'>WARTEN_S</span>. The same applies to mode. <b>Writer watch:</b> <span class='sm-mono'>von=loxone</span> tells the plugin that the command comes from the Miniserver; if anybody besides Loxone sends setpoints (the aWATTar coupling, for example), the Test tab shows it. An address without <span class='sm-mono'>von=</span> keeps working and shows up there as „no tag“."
SP_BEFEHL_ANALOG = "Command on ON (analogue)"
SP_BEFEHL_AUTO = "Command: hand control back"
TOKEN_WARNUNG = "<b>The token belongs in every one of these addresses.</b> The endpoint sits in the unauthenticated area so that the Miniserver can reach it without credentials — without a matching token it answers with HTTP 403. <b>A virtual output does not evaluate the answer:</b> a wrong token therefore goes unnoticed, the battery simply stands still."
S_AUSFALL = "Detecting failures"
AUSFALL_TEXT = "<b>A virtual input keeps its last value when the source is unreachable</b> — in the app everything then looks normal. Three fields exist for this, and the matching blocks are in the list below: <span class='sm-mono'>MARSTEK_STATUS_OK</span> says whether the battery answers. <span class='sm-mono'>MARSTEK_STATUS_ALTER</span> says how old the last real measurement is — the numbers stay put during a fault instead of dropping to 0, and only the age reveals that they are old. <span class='sm-mono'>MARSTEK_STATUS_ZAEHLER</span> advances by one on every minute task; if it stops, the task on the LoxBerry is no longer running, and then every other value is frozen."
S_BAUSTEINE = "Complete block list to rebuild"
BAUSTEINE_VORTEXT = "This is how the logic is built in the reference project. It requires a meter delivering the <b>grid power in watts</b>, with import positive and export negative. The blocks are found in Loxone Config through the block search (key <b>F5</b>). The inputs column names the row number the signal comes from."
BAUSTEINE_NACHTEXT = "<b>On #27 and #28:</b> an AND block has two inputs; three conditions therefore need two blocks in sequence. <b>On #36 and #38:</b> the analogue memory holds the setpoint, and the dither pulse alternately adds 0 and 1. Without this trick the virtual output only sends on a change of value — if the setpoint stays the same for an hour, the watchdog in the device expires and the battery stops. <b>On #40:</b> the notification block only fires on a change from off to on. Never wire several sources directly to its input — merge them through an OR first, otherwise a permanently active source swallows all the others. <b>On #41:</b> the change monitor on MARSTEK_STATUS_ZAEHLER is the only line that catches a stalled minute task. <b>On #42 to #44:</b> if the battery accepts the setpoint without acting on it, MARSTEK_STATUS_SOLL and MARSTEK_STATUS_BATP drift apart permanently. The report needs threshold #42 in front of it: as long as no setpoint has been accepted at all, MARSTEK_STATUS_SOLL holds the error value -32768, and the deviation would always exceed 200 — in automatic mode and after every auto fallback #44 would otherwise report permanently."
