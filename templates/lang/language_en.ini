SCHUTZ_ERKLAERUNG = "These are <b>settings, not measurements</b>. When enabled the plugin rejects a setpoint that would violate the limits — 45 degrees matches the threshold the block list also suggests, 0 degrees the limit below which a lithium battery should not be charged. Only <b>what has actually been measured</b> is judged: a missing reading, or one older than 15 minutes, produces neither a block nor a release. Off by default — the battery has its own protection, and an update must not change the behaviour of a running installation unasked."
SICHERUNG_ERKLAERUNG = "The backup file <b>carries the action token in clear text</b>. That is intentional: a backup without the token would be worthless after restoring, because every address in the Miniserver would become invalid. The file therefore must not be shared and must not go into a cloud. When restoring, anything that does not fit is rejected — never bent into shape."
