Z1_20 = "Formula | Abweichung Soll gegen Ist (W) | ABS(I1-I2) | I1 = #10, I2 = #3"
Z1_21 = "Threshold Switch | Abweichung über 200 W | On 200 / Off 150 (W) | Input = #20"
