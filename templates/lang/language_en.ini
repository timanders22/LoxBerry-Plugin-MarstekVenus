SEITE1_SCHRITT1 = "Switch on the local API (“Open API”/“local mode”) in the Marstek app. In the plugin, tab “Test” → “Search for batteries on the network” → “Add to the device list”, choose the model in tab “Settings” and save. In tab “MQTT” switch on “Also publish values via MQTT” and – for the Auto and AI buttons – “Accept commands via MQTT”."
SEITE1_SCHRITT2 = "Further up in this tab, step 2: create the inputs of this page as virtual inputs (select Virtual Inputs → Virtual Input; name exactly as in the name table, copy button; do not activate “Use as digital input”). There is no import template for the values via the MQTT gateway. The LoxBerry user at the Miniserver needs rights on the inputs. Step 3: with gateway version 1 enter the subscription, with version 2 tick the data points."
SEITE1_SCHRITT3 = "Create the page “Marstek Venus E”. Drag the 12 inputs (no. 1–12) onto the page, and the “Konstante 1” from the tree (no. 13). The inputs are named like the data points of the MQTT gateway (marstek_…) – do not rename them, otherwise the gateway creates a second input; the column “Meaning” gives the readable name. If you copy the page from the LoxBerry plugins sample project, you get the inputs with it."
SEITE1_SCHRITT4 = "At the shared output “LoxBerry MQTT-Gateway” (virtual output with the address /dev/udp/<LoxBerry>/11884; already there in the sample project) create two commands: “Marstek Handbetrieb: Modus Auto” with command on ON publish marstek/befehl/modus_auto 1 and “Marstek Handbetrieb: Modus AI” with publish marstek/befehl/modus_ai 1 (no. 33, 35; never “retain”). Or import “Setpoint and Auto/AI buttons (MQTT commands)” in step 4 – this creates an own output “Marstek MQTT-Befehle”. Create the notification “Meldung Marstek Venus E” (Periphery → Messages → Notification), text as in the table; two virtual inputs as push buttons (no. 32, 34)."
SEITE1_SCHRITT5 = "Place the other blocks with the block search (F5), parameters as in the table, connect from top to bottom; OR and AND have two inputs each. Value Validator no. 16: remove the tick at ‘En’ in the properties window (Config creates En inverted; otherwise the constant 1 arrives as 0 and the failure message never triggers). Status “Marstek-Zustand”: click “+” twice first (V5, V6). The status rows and the message text are in the table and are entered by hand, the row without condition last. Switch on “Statistics” at state of charge and battery power; enter the meter for storage as storage in the energy flow monitor."
SEITE1_SCHRITT6 = "Save and send to the Miniserver. Check: “marstek_status_zaehler” counts on every minute; “Marstek-Zustand” shows “reachable – measurement … s old”. Press the Auto or AI button: in the plugin, tab “Test”, the last command with “angenommen” appears under “Command bridge”."
SEITE1_H1 = "<b>On no. 16:</b> the value validator finds a silent plugin: if no new value of “marstek_status_zaehler” arrives within Tmc, its output E reports. 600 s are ten minute cycles – the UDP input of the MQTT gateway loses single datagrams under load, and a single loss should not report. The constant 1 to En – and remove the tick at ‘En’ in the properties window."
SEITE1_H2 = "<b>On no. 17 to 23:</b> the setpoint check only works while Loxone is sending (setpoint fresh, no. 18) – after “control off” it does not report. No. 17 hides the error value -32768 (“no setpoint”); the 900 s at no. 23 also swallow the short pulse a threshold switch gives on every new value."
SEITE1_H3 = "<b>On no. 24 to 26:</b> the notification only sends on a change from off to on and gets exactly one line – the three faults are therefore combined through two ORs (two inputs each)."
SEITE1_H4 = "The Venus E sometimes answers nobody for 20 to 60 seconds – that is why the page only reports after 15 minutes."
SEITE1_H5 = "The Auto and AI buttons only work with the control switched off (page “Marstek Venus E Steuerung”); otherwise Loxone sets a setpoint again after 60 s at the latest. Via MQTT they need “Accept commands via MQTT” and “Control active” in the plugin; the same button only acts once within a minute."
SEITE1_H6 = "“Marstek Netzleistung” is the power at the connection of the storage, not the house meter – the control uses your own meter."
SEITE1_H7 = "Several storages: the name table in step 2 lists own names for each storage (device 2 and following carry the number: marstek_2_soc …); the buttons there are marstek/befehl/2/modus_auto etc. Faults through further ORs (two inputs each) in front of the notification – never several sources directly at it. The template “Marstek Summe” (only from two storages, HTTP only) is not part of the sample."
SEITE1_H8 = "“marstek_ok” does not age by itself via MQTT: if the minute cycle dies, the 1 would stay – that is exactly why no. 16 reports the missing sign of life. Existing installations with the HTTP templates keep running unchanged (section “For existing installations: HTTP” below)."
SEITE2_SCHRITT1 = "In the plugin, tab “Settings”, check: “Control active” switched on, power limits matching the model, “Auto fallback after” (default 30 minutes). Under “Spot prices (aWATTar)” choose the market Germany or Austria and enter the surcharge in ct/kWh. In tab “MQTT” switch on “Accept commands via MQTT” – no. 40 shows that the command service is running."
SEITE2_SCHRITT2 = "Create the rank inputs of this page from the name table in step 2 above (virtual input, name exactly like that). At the shared output “LoxBerry MQTT-Gateway” create the command “Marstek Sollwert senden”: command on analog value publish marstek/befehl/sollwert <v.0> (no. 35; never “retain”) – or import “Setpoint and Auto/AI buttons (MQTT commands)” in step 4 above. Provide your own electricity meter as “Netzleistung (eigene Quelle)” – plus = import, minus = feed-in, in watts. If your meter delivers it the other way round, invert it first with a formula 0-I1."
SEITE2_SCHRITT3 = "Create the page “Marstek Venus E Steuerung” and drag the inputs: marstek_batp, marstek_soc, marstek_ok, marstek_sollalter and marstek_status_befehle (further instance of the inputs of page “Marstek Venus E”), marstek_rang_rank, marstek_rang_rankd, marstek_rang_neg, “Marstek Sollwert senden” (command at the output “LoxBerry MQTT-Gateway”), and “Netzleistung (eigene Quelle)”."
SEITE2_SCHRITT4 = "Create nine virtual inputs: five switches (no. 8–12), three sliders (no. 13–15) with the limits and start values of the table, and “Wallbox-Ladeleistung (eigene Quelle)” (no. 37; leave 0 without a wallbox)."
SEITE2_SCHRITT5 = "Place and connect the other blocks via F5; OR and AND have two inputs each. Copy the formulas exactly (function names in capitals, separator “;”). Status “Speicher-Regelung jetzt”: click “+” three times first (V5–V7); enter the status rows by hand, the row without condition last. Create the notification “Meldung Marstek Sollwert kommt nicht an” (no. 45)."
SEITE2_SCHRITT6 = "Spot saving (no. 46–62, only with the plugin “Spotpreis aWATTar”): drag its inputs spot_awattar_cur and spot_awattar_avg_heute (gateway names, see there) as further instances. “Wochentag” is in the tree under “Zeitfunktionen”. Switch on “Remanence” at the analog memories no. 51 and 58. Status no. 60 “Visualisation” off, no. 62 on; the notification no. 61 gets the status text of no. 60 (output TQ)."
SEITE2_H1 = "<b>On no. 16, 21 and 27:</b> the controller calculates with the own battery power (“Überschuss ohne Speicher” = battery power minus grid power). Up to 1.1.22 the list calculated only from the feed-in at the house meter: if the storage charges the surplus, the feed-in drops, and the setpoint swung every two minutes between the surplus and 0 W."
SEITE2_H2 = "<b>On no. 17 and 23:</b> “Less or Equal” with the rank at I1 and the number at I2: 1 if the current hour is among the set cheapest (or most expensive) ones. Up to 1.1.22 the charging-hours row was the wrong way round (number at I1) and charged in the expensive hours – if you built it that way, swap the two inputs. The second input is connected; the parameter V2 of the block then does not apply."
SEITE2_H3 = "<b>On no. 31 to 34:</b> “Senden erlaubt” (no. 32) drives the analog memory AND the dither: with the control switched off or a silent storage the output sends nothing more. The dither adds 0 and 1 alternately – otherwise the virtual output only sends on a change of value, and with an unchanged setpoint the watchdog (240 s) in the device would run out. The send cycle is 30 s: with gateway version 1 the UDP input loses datagrams under load; the storage only stops after seven lost setpoints in a row."
SEITE2_H4 = "Without “Speicher Entladung ins Hausnetz erlaubt” the storage only charges. With “Speicher nur in teuersten Stunden entladen” it discharges only in the set most expensive hours of the next 24 hours."
SEITE2_H5 = "Spot price charging needs BOTH switches (no. 9 and 10); at a negative price the storage then always charges with full power and never discharges."
SEITE2_H6 = "Venus E Mini: in formula no. 21 replace 2500 by 1500 and in no. 27 by 800 (otherwise the plugin limits by itself)."
SEITE2_H7 = "The setpoint goes out again every 30 s (the plugin passes the same value on to the storage at most every 58 s); if it stays away (LoxBerry or Miniserver off), the storage stops by itself after 240 s."
SEITE2_H8 = "If anybody besides Loxone sends setpoints (a second control, the aWATTar coupling), the Test tab shows it under “Writers of the last 24 hours” – then switch one off."
SEITE3_SCHRITT1 = "For the meters switch on Modbus TCP at the storage (only Venus E Gen 3.0 from firmware 144, only with LAN cable) and set “kWh meters (Modbus)” in the plugin, tab “Settings”. Without Modbus the lower half of the page stays empty – the status says so."
SEITE3_SCHRITT2 = "Create the 10 meter inputs (marstek_energie_…) as virtual inputs from the name table in step 2 above; the rank inputs are already there from the page “Marstek Venus E Steuerung”."
SEITE3_SCHRITT3 = "Create the page “Marstek Venus E Werte”, drag the 13 rank commands (no. 1–13; no. 3, 4 and 6 as further instance) and the 10 meter commands (no. 19–28); switch on “Statistics” at price of this hour, charged today and discharged today."
SEITE3_SCHRITT4 = "Create the notification “Meldung Marstek Spotpreise”, the other blocks via F5. “+”: “Preisfenster heute und morgen (Marstek)” four times (V5–V8), “Marstek heute und Monat” twice (V5, V6). Enter status rows and message text by hand."
SEITE3_SCHRITT5 = "Monthly balance (no. 31–37): drag “Monatsimpuls” onto the page from “Zeitfunktionen” in the tree (Config gives the name itself). Switch on “Remanence” at the analog memories no. 33 and 34. Status no. 36: click “+” once (V4), “Visualisation” off; the notification no. 37 gets the status text of no. 36 (output TQ)."
SEITE3_H1 = "The prices are euros per kWh; the status blocks convert them to cents. The rank counts in the window from now to 24 hours ahead – in the evening, before the prices for tomorrow are there, these are fewer hours."
SEITE3_H2 = "The ranks come from the plugin itself (aWATTar Germany or Austria); the plugin “Spotpreis aWATTar” is not needed for them."
SEITE3_H3 = "Without Modbus only “meters valid” 0 and “age of the meter readings” -1 arrive via MQTT (every half hour); “Marstek heute und Monat” then says what is missing (Modbus TCP, LAN cable, firmware from 144). Meter readings never read stand at -1."
Z1_01 = "Virtual Input (name as the MQTT gateway assigns it, plugin Marstek Venus E) | marstek_ok | 1 = the last run of the plugin reached the storage, 0 = no answer (arrives every minute via the gateway) | — (arrives via the gateway)"
Z1_02 = "Virtual Input (name as the MQTT gateway assigns it, plugin Marstek Venus E) | marstek_soc | State of charge in %; -1 = never measured yet; statistics on | —"
Z1_03 = "Virtual Input (name as the MQTT gateway assigns it, plugin Marstek Venus E) | marstek_batp | Battery power in W, plus = charging, minus = discharging; statistics on | —"
Z1_04 = "Virtual Input (name as the MQTT gateway assigns it, plugin Marstek Venus E) | marstek_temp | Battery temperature in °C | —"
Z1_05 = "Virtual Input (name as the MQTT gateway assigns it, plugin Marstek Venus E) | marstek_gridp | Power at the grid connection of the storage in W (reported by the device; not the house meter) | —"
Z1_06 = "Virtual Input (name as the MQTT gateway assigns it, plugin Marstek Venus E) | marstek_fw | Firmware version of the device (e.g. 148); -1 = unknown | —"
Z1_07 = "Virtual Input (name as the MQTT gateway assigns it, plugin Marstek Venus E) | marstek_ms | Response time of the device in ms; -1 = never measured yet | —"
Z1_08 = "Virtual Input (name as the MQTT gateway assigns it, plugin Marstek Venus E) | marstek_alter | Seconds since the last real measurement, calculated when sending; -1 = never measured yet; stands still when the plugin is silent (then no. 16 reports) | —"
Z1_09 = "Virtual Input (name as the MQTT gateway assigns it, plugin Marstek Venus E) | marstek_status_zaehler | Sign of life of the plugin: runs 0…999 and wraps, one further every minute | —"
Z1_10 = "Virtual Input (name as the MQTT gateway assigns it, plugin Marstek Venus E) | marstek_soll | Setpoint last accepted by the storage in W, plus = charging; -32768 = none | —"
Z1_11 = "Virtual Input (name as the MQTT gateway assigns it, plugin Marstek Venus E) | marstek_sollalter | Seconds since the last accepted setpoint; -1 = none | —"
Z1_12 = "Virtual Input (name as the MQTT gateway assigns it, plugin Marstek Venus E) | marstek_fbrest | Seconds until the plugin hands control back to the auto mode; -1 = switched off, -2 = no passive mode | —"
Z1_13 = "Constant | Konstante 1 | Value 1 | —"
Z1_14 = "NOT | Speicher nicht erreichbar | — | I = #1"
Z1_15 = "Switch-On Delay | Störung länger als 15 Minuten | 900 s (the Venus E sometimes answers nobody for 20 to 60 s) | Input = #14"
Z1_16 = "Value Validator | Lebenszeichen fehlt | Tmc 600 s (ten cycles; the UDP input of the gateway loses datagrams under load), Min 0, Max 999; remove the tick at ‘En’ in the properties window | V = #9, En = #13"
Z1_17 = "Threshold Switch | Sollwert ist überhaupt gesetzt | On -30000 / Off -31000 (the error value -32768 “no setpoint” stays off) | Input = #10"
Z1_18 = "Threshold Switch | Sollwert frisch | On 250 / Off 300 (s; switches when falling below – only while Loxone is sending) | Input = #11"
Z1_19 = "AND | Sollwert gesetzt und frisch | — | I1 = #17, I2 = #18"
Z1_20 = "Formula | Abweichung Soll gegen Ist (W) | ABS(I1-I2) | I1 = #10, I2 = #3"
Z1_21 = "Threshold Switch | Abweichung über 200 W | On 200 / Off 150 (W) | Input = #20"
Z1_22 = "AND | Sollwert wird nicht umgesetzt | — | I1 = #19, I2 = #21"
Z1_23 = "Switch-On Delay | Sollwert-Abweichung hält an | 900 s (also swallows the short pulse of the threshold switches on every new value) | Input = #22"
Z1_24 = "OR | Marstek gestört, Teil 1 | — (no answer for 15 min or no sign of life for 10 min) | I1 = #15, I2 = output E of #16"
Z1_25 = "OR | Marstek gestört | — (plus: setpoint is not implemented) | I1 = #24, I2 = #23"
Z1_26 = "Notification | Meldung Marstek Venus E | Text: Marstek Venus E – the storage has not answered for 15 minutes, the plugin has not reported for 10 minutes (minute cycle or MQTT gateway) or the storage has not implemented the setpoint for 15 minutes. Read the status “Marstek-Zustand” in the app | Input = #25"
Z1_27 = "Status | Speicher jetzt (Marstek) | Rows: V2 > 0 “charging with <v2> W – <v1.1> %, <v3.1> °C”; V2 < 0 “discharging with <v2> W – <v1.1> %, <v3.1> °C”; without condition “idle – <v1.1> %, <v3.1> °C, grid connection of the storage <v4> W”; visualisation ON | V1 = #2, V2 = #3, V3 = #4, V4 = #5"
Z1_28 = "Status | Marstek-Zustand | Rows: V3 = 1 “no sign of life from the plugin for 10 minutes – LoxBerry reachable? MQTT gateway running? In the plugin, tab Log files, look at cron.err”; V1 = 0 “storage does not answer, last measurement <v2> s ago – local API switched on in the Marstek app? Device in standby? In the plugin, tab Test ‘Search for batteries on the network’”; without condition “reachable – measurement <v2> s old, response time <v4> ms, firmware <v5>, sign of life <v6>”; visualisation ON | V1 = #1, V2 = #8, V3 = output E of #16, V4 = #7, V5 = #6, V6 = #9"
Z1_29 = "Status | Sollwert und Rückfall (Marstek) | Rows: V1 < -30000 “no setpoint – the storage runs in its own operating mode (Auto or AI)”; V3 >= 0 “setpoint <v1> W, accepted <v2> s ago; if nothing more comes, back to Auto in <v3> s”; without condition “setpoint <v1> W, accepted <v2> s ago (auto fallback switched off in the plugin)”; visualisation ON | V1 = #10, V2 = #11, V3 = #12"
Z1_30 = "Formula | Marstek Batterieleistung (kW) | I1/1000 (the meter block shows kW, the plugin delivers W) | I1 = #3"
Z1_31 = "Meter for Storage | Marstek Speicher | Storage for the energy flow monitor; max. storage level 100, units <v.3> kW and <v.1> kWh | Pf = #30, Slvl = #2"
Z1_32 = "Virtual Input (Push Button) | Regie an den Speicher zurückgeben | in the app; first switch off the control on page “Marstek Venus E Steuerung”, otherwise it sets a setpoint again after 60 s at the latest | —"
Z1_33 = "Virtual Output Command (shared output “LoxBerry MQTT-Gateway”) | Marstek Handbetrieb: Modus Auto | Command on ON: publish marstek/befehl/modus_auto 1 (never retain); the plugin switches the storage to its auto mode if ‘Accept commands via MQTT’ is on in the plugin | Input = #32"
Z1_34 = "Virtual Input (Push Button) | KI-Modus des Speichers | in the app; the storage controls itself according to its own forecast (AI mode of the Marstek app); like no. 32 only with the control switched off | —"
Z1_35 = "Virtual Output Command (shared output “LoxBerry MQTT-Gateway”) | Marstek Handbetrieb: Modus AI | Command on ON: publish marstek/befehl/modus_ai 1 (never retain); switches the storage to its AI mode | Input = #34"
Z2_01 = "Virtual Input | Netzleistung (eigene Quelle) | Power at your own electricity meter in W, plus = import, minus = feed-in; the same input as on “AnkerSolix Steuerung”; in your own project feed it from your own meter (e.g. plugin Smartmeter vzLogger) | —"
Z2_02 = "Virtual Input (name as the MQTT gateway assigns it, plugin Marstek Venus E) | marstek_batp | Battery power in W, plus = charging (further instance, also on page “Marstek Venus E”) | —"
Z2_03 = "Virtual Input (name as the MQTT gateway assigns it, plugin Marstek Venus E) | marstek_soc | State of charge in % (further instance) | —"
Z2_04 = "Virtual Input (name as the MQTT gateway assigns it, plugin Marstek Venus E) | marstek_ok | 1 = storage answers (further instance) | —"
Z2_05 = "Virtual Input (name as the MQTT gateway assigns it, plugin Marstek Venus E) | marstek_rang_rank | Rank of the current hour in the next 24 hours, 1 = cheapest; 99 = no prices | —"
Z2_06 = "Virtual Input (name as the MQTT gateway assigns it, plugin Marstek Venus E) | marstek_rang_rankd | The same rank the other way round, 1 = most expensive hour; 99 = no prices | —"
Z2_07 = "Virtual Input (name as the MQTT gateway assigns it, plugin Marstek Venus E) | marstek_rang_neg | 1 = the electricity price of this hour is negative | —"
Z2_08 = "Virtual Input (Switch) | Speicher-Regelung ein | in the app; off by default. Off: Loxone sends nothing more, the storage stops after 240 s and goes into the auto mode after the fallback time of the plugin (default 30 min) | —"
Z2_09 = "Virtual Input (Switch) | Speicher Netzladen erlaubt | in the app; off by default; allows charging from the grid in cheap hours | —"
Z2_10 = "Virtual Input (Switch) | Speicher Spotpreis-Laden aktiv | in the app; off by default; charges in the cheapest hours and at a negative price with full power (only together with no. 9) | —"
Z2_11 = "Virtual Input (Switch) | Speicher Entladung ins Hausnetz erlaubt | in the app; off by default; without it the storage only charges | —"
Z2_12 = "Virtual Input (Switch) | Speicher nur in teuersten Stunden entladen | in the app; off by default; on = discharge only in the most expensive hours (no. 14), off = whenever the house needs power | —"
Z2_13 = "Virtual Input (Slider) | Anzahl günstigste Stunden (laden) | Min 0, Max 24, step 1, start value 3 | —"
Z2_14 = "Virtual Input (Slider) | Anzahl teuerste Stunden (entladen) | Min 0, Max 24, step 1, start value 4 | —"
Z2_15 = "Virtual Input (Slider) | Mindest-Ladezustand (Proz) | Min 10, Max 100, step 5, start value 20; no discharging below | —"
Z2_16 = "Formula | Überschuss ohne Speicher (W) | I1-I2 = battery power minus grid power – plus = this much the storage could charge, minus = this much the house needs | I1 = #2, I2 = #1"
Z2_17 = "Less or Equal | Rang in Ladestunden | — (1 if the current hour is among the cheapest) | I1 = #5, I2 = #13"
Z2_18 = "OR | Spotladung nötig | — (cheap hour or negative price) | I1 = #7, I2 = #17"
Z2_19 = "AND | Spotpreis-Laden jetzt | — | I1 = #18, I2 = #10"
Z2_20 = "AND | Netzladen jetzt | — | I1 = #19, I2 = #9"
Z2_21 = "Formula | Ladewunsch (W) | MIN(MAX(MAX(I1-100;0);I2*2500);2500) – charge the surplus and let 100 W be fed in; full power when charging from the grid; 2500 = charging limit Venus E (Mini: 1500) | I1 = #16, I2 = #20"
Z2_22 = "Greater or Equal | Ladezustand über Reserve | — | I1 = #3, I2 = #15"
Z2_23 = "Less or Equal | Rang in Entladestunden | — (1 if the current hour is among the most expensive) | I1 = #6, I2 = #14"
Z2_24 = "NOT | Nur-teuerste-Modus ist aus | — | I = #12"
Z2_25 = "OR | Entladefenster erfüllt | — | I1 = #23, I2 = #24"
Z2_26 = "AND | Entladung erlaubt | — | I1 = #25, I2 = #11"
Z2_27 = "Formula | Entladewunsch (W) | MIN(MAX(0-I1-50;0);2500)*I2*I3*(1-I4) – cover the demand without the wallbox and let 50 W be drawn; never below the reserve, never at a negative price; 2500 = discharging limit Venus E (Mini: 800) | I1 = #38, I2 = #26, I3 = #22, I4 = #7"
Z2_28 = "Threshold Switch | Ladezustand über 97 Prozent | On 97 / Off 96 (%) | Input = #3"
Z2_29 = "Formula | Speicher Sollleistung (W) | I1*(1-I3)-I2 – plus charges, minus discharges; above 97 % no charging | I1 = #21, I2 = #27, I3 = #28"
Z2_30 = "AND | Regelung freigegeben | — (switch on and storage answers) | I1 = #8, I2 = #4"
Z2_31 = "Pulse Generator | Sendetakt 30 s | Don 30 s, Doff 30 s (the UDP input of the gateway loses datagrams under load; so the storage only stops after seven lost setpoints in a row) | —"
Z2_32 = "AND | Senden erlaubt | — | I1 = output Q of #31, I2 = #30"
Z2_33 = "Analog Memory | Sollleistung halten | takes over the setpoint only when released at the start of each send cycle (every 30 s); when switched off it stays where it is | V = #29, Set = #32"
Z2_34 = "Formula | Sollwert plus Dither | I1+I2 – adds 0 and 1 alternately in the cycle so that the output sends again every 30 s, even with the same setpoint; stands still while the control is off | I1 = #33, I2 = #32"
Z2_35 = "Virtual Output Command (shared output “LoxBerry MQTT-Gateway”) | Marstek Sollwert senden | Command on analog value: publish marstek/befehl/sollwert <v.0> (never retain); setpoint in W, + charges / - discharges; the storage holds it for 240 s (watchdog); only takes effect if ‘Accept commands via MQTT’ (tab MQTT) and ‘Control active’ (tab Settings) are ticked in the plugin | Input = #34"
Z2_36 = "Status | Speicher-Regelung jetzt | Rows: V5 = 0 “control off – the storage stops after 240 s and goes into the auto mode after the fallback time”; V1 = 0 “storage does not answer – nothing is sent”; V7 = 0 “command service of the plugin is not running – switch on ‘Accept commands via MQTT’ in the plugin, tab MQTT”; V6 = 1 “setpoints have not reached the storage for 10 minutes – check ‘Accept commands via MQTT’, ‘Control active’ and the Test tab in the plugin”; V4 = 1 “charging from the grid (cheap hour or negative price): setpoint <v2> W”; V2 > 0 “charging surplus: setpoint <v2> W, surplus <v3> W”; V2 < 0 “discharging into the house: setpoint <v2> W, demand <v3> W”; without condition “idle: setpoint <v2> W, surplus <v3> W”; visualisation ON | V1 = #30, V2 = #33, V3 = #16, V4 = #20, V5 = #8, V6 = #44, V7 = #40"
Z3_01 = "Virtual Input (name as the MQTT gateway assigns it, plugin Marstek Venus E) | marstek_rang_ok | 1 = prices for the current hour and at least six hours ahead available | — (arrives via the gateway)"
Z3_02 = "Virtual Input (name as the MQTT gateway assigns it, plugin Marstek Venus E) | marstek_rang_n | Number of hours with a price in the window (up to 24) | —"
Z3_03 = "Virtual Input (name as the MQTT gateway assigns it, plugin Marstek Venus E) | marstek_rang_rank | Rank of the current hour in the next 24 hours, 1 = cheapest; 99 = no prices (further instance, also on page “Marstek Venus E Steuerung”) | —"
Z3_04 = "Virtual Input (name as the MQTT gateway assigns it, plugin Marstek Venus E) | marstek_rang_rankd | The same rank the other way round, 1 = most expensive hour; 99 = no prices (further instance, also on page “Marstek Venus E Steuerung”; display only here) | —"
Z3_05 = "Virtual Input (name as the MQTT gateway assigns it, plugin Marstek Venus E) | marstek_rang_curp | Electricity price now in EUR/kWh (exchange price plus surcharge from the plugin, with VAT); -1 = no price; statistics on | —"
Z3_06 = "Virtual Input (name as the MQTT gateway assigns it, plugin Marstek Venus E) | marstek_rang_neg | 1 = price negative (further instance) | —"
Z3_07 = "Virtual Input (name as the MQTT gateway assigns it, plugin Marstek Venus E) | marstek_rang_minp | Lowest price in the window in EUR/kWh; -1 = no prices | —"
Z3_08 = "Virtual Input (name as the MQTT gateway assigns it, plugin Marstek Venus E) | marstek_rang_maxp | Highest price in the window in EUR/kWh; -1 = no prices | —"
