Z1_23 = "Switch-On Delay | Sollwert-Abweichung hält an | 900 s (also swallows the short pulse the threshold switches give on every poll) | Input = #22"
Z1_24 = "OR | Marstek gestört, Teil 1 | — (no answer for 15 min or minute cycle stopped) | I1 = #15, I2 = output E of #16"
Z1_25 = "OR | Marstek gestört | — (plus: setpoint is not implemented) | I1 = #24, I2 = #23"
Z1_26 = "Notification | Meldung Marstek Venus E | Text: Marstek Venus E – the storage has not answered for 15 minutes, the minute cycle of the plugin has stopped or the storage has not implemented the setpoint for 15 minutes. Read the status “Marstek-Zustand” in the app | Input = #25"
Z1_27 = "Status | Speicher jetzt (Marstek) | Rows: V2 > 0 “charging with <v2> W – <v1.1> %, <v3.1> °C”; V2 < 0 “discharging with <v2> W – <v1.1> %, <v3.1> °C”; without condition “idle – <v1.1> %, <v3.1> °C, grid connection of the storage <v4> W”; visualisation ON | V1 = #2, V2 = #3, V3 = #4, V4 = #5"
Z1_28 = "Status | Marstek-Zustand | Rows: V3 = 1 “minute cycle of the plugin has stopped – LoxBerry reachable? In the plugin, tab Log files, look at cron.err”; V1 = 0 “storage does not answer, last measurement <v2> s ago – local API switched on in the Marstek app? Device in standby? In the plugin, tab Test ‘Search for batteries on the network’”; without condition “reachable – measurement <v2> s old, response time <v4> ms, firmware <v5>, cycle <v6>”; visualisation ON | V1 = #1, V2 = #8, V3 = output E of #16, V4 = #7, V5 = #6, V6 = #9"
Z1_29 = "Status | Sollwert und Rückfall (Marstek) | Rows: V1 < -30000 “no setpoint – the storage runs in its own operating mode (Auto or AI)”; V3 >= 0 “setpoint <v1> W, accepted <v2> s ago; if nothing more comes, back to Auto in <v3> s”; without condition “setpoint <v1> W, accepted <v2> s ago (auto fallback switched off in the plugin)”; visualisation ON | V1 = #10, V2 = #11, V3 = #12"
Z1_30 = "Formula | Marstek Batterieleistung (kW) | I1/1000 (the meter block shows kW, the plugin delivers W) | I1 = #3"
Z1_31 = "Meter for Storage | Marstek Speicher | Storage for the energy flow monitor; max. storage level 100, units <v.3> kW and <v.1> kWh | Pf = #30, Slvl = #2"
Z1_32 = "Virtual Input (Push Button) | Regie an den Speicher zurückgeben | in the app; first switch off the control on page “Marstek Venus E Steuerung”, otherwise it sets a setpoint again after 120 s at the latest | —"
