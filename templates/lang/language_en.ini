[LOX]
H_EINBINDUNG = "Loxone integration — step by step"
GRUNDGEDANKE = "<b>Loxone is the energy manager, not the plugin.</b> The plugin delivers readings and prices, the Miniserver decides and sends power setpoints. Two safety nets sit underneath: the watchdog in the setpoint stops the battery when nothing arrives from Loxone any more, and the auto fallback then hands control back to the device's own auto mode."
SCHRITT = "Step %d"
S1_TITEL = "Switch on MQTT"
S_ABO = "Subscription and data points in the MQTT gateway"
S_EINGAENGE = "Virtual inputs (HTTP)"
S1_TEXT = "<b>The LoxBerry plugins sample project and the block lists in step 6 use MQTT</b> – the values arrive via the MQTT gateway at plain virtual inputs (name table in step 2, no import template), the setpoint of the control and the Auto and AI buttons go via the command bridge of the plugin (step 4). Existing installations with the HTTP templates keep running unchanged; their inputs are below under “For existing installations: HTTP”."
