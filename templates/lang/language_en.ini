S_NAMEN = "Creating the virtual inputs (name table)"
NAMEN_TEXT = "There is <b>no import template</b> for the values via the MQTT gateway – the LoxBerry instructions for the MQTT gateway require a plain “Virtual Input”, not a “Virtual HTTP Input”. In Loxone Config create one <b>virtual input</b> per row (select Virtual Inputs → Virtual Input), for a text a virtual text input. Enter <b>exactly</b> the name from the table as the name (button “Copy”) – any other name gives a second input with the first value. Do <b>not</b> activate “Use as digital input”, not even for the 0/1 values. The readable name for the app (column “Meaning”) is set by hand in Loxone."
NAMEN_RECHTE = "The LoxBerry user stored at the Miniserver (the MQTT gateway writes with it) needs <b>rights on these inputs</b> in Loxone Config – without them the values do not arrive."
NAMEN_MUSTER = "If you copy the pages “Marstek Venus E”, “Marstek Venus E Steuerung” and “Marstek Venus E Werte” from the LoxBerry plugins sample project, you get the inputs with them."
