SEITE1_SCHRITT1 = "Switch on the local API (“Open API”/“local mode”) in the Marstek app. In the plugin, tab “Test” → “Search for batteries on the network” → “Add to the device list”, choose the model in tab “Settings” and save. Tab “Test” → “Fetch status (raw data)”: a line starting with MARSTEK;OK=1 appears."
SEITE1_SCHRITT2 = "Further down in this tab, section “Create everything at once”: “Create template for Loxone Config” (archive with all files). In Loxone Config: select Virtual Inputs → Predefined HTTP devices → import template: VI_marstek_status.xml; select Virtual Outputs → Predefined devices → import template: VQ_marstek_steuern.xml. Import each file only ONCE (twice gives duplicate blocks). The VQ file contains the action token – do not pass it on."
SEITE1_SCHRITT3 = "Create the page “Marstek Venus E”. Drag the 12 commands from the container “Marstek Status Venus E” (no. 1–12), the commands “Handbetrieb: Modus Auto” and “Handbetrieb: Modus AI” from “Marstek steuern Venus E” (no. 33, 35), and the “Konstante 1” from the tree (no. 13)."
SEITE1_SCHRITT4 = "Create the notification “Meldung Marstek Venus E” (Periphery → Messages → Notification), text as in the table, drag it onto the page. Create two virtual inputs as push buttons (no. 32, 34)."
SEITE1_SCHRITT5 = "Place the other blocks with the block search (F5), parameters as in the table, connect from top to bottom; OR and AND have two inputs each. Value Validator no. 16: remove the tick at ‘En’ in the properties window (Config creates En inverted; otherwise the constant 1 arrives as 0 and the failure message never triggers). Status “Marstek-Zustand”: click “+” twice first (V5, V6). The status rows and the message text are in the table and are entered by hand, the row without condition last. Switch on “Statistics” at state of charge and battery power; enter the meter for storage as storage in the energy flow monitor."
SEITE1_SCHRITT6 = "Save and send to the Miniserver. Check: “Marstek Herzschlag (vorige Runde)” counts on every minute; “Marstek-Zustand” shows “reachable – measurement … s old”."
SEITE1_H1 = "<b>On no. 16:</b> the value validator finds a stopped minute cycle: if no new value arrives within Tmc, its output E reports; if the cycle stops for longer than 180 s, the plugin delivers -1, which is below Min 0. “Marstek Herzschlag (vorige Runde)” to V, the constant 1 to En – and remove the tick at ‘En’ in the properties window."
SEITE1_H2 = "<b>On no. 17 to 23:</b> the setpoint check only works while Loxone is sending (setpoint fresh, no. 18) – after “control off” it does not report. No. 17 hides the error value -32768 (“no setpoint”); the 900 s at no. 23 also swallow the short pulse a threshold switch gives on every poll."
SEITE1_H3 = "<b>On no. 24 to 26:</b> the notification only sends on a change from off to on and gets exactly one line – the three faults are therefore combined through two ORs (two inputs each)."
SEITE1_H4 = "The Venus E sometimes answers nobody for 20 to 60 seconds – that is why the page only reports after 15 minutes."
SEITE1_H5 = "The Auto and AI buttons only work with the control switched off (page “Marstek Venus E Steuerung”); otherwise Loxone sets a setpoint again after 120 s at the latest."
SEITE1_H6 = "“Marstek Netzleistung” is the power at the connection of the storage, not the house meter – the control uses your own meter."
SEITE1_H7 = "Several storages: fetch the templates for each storage with the buttons under “Download individually”; faults through further ORs (two inputs each) in front of the notification – never several sources directly at it. The template “Marstek Summe” (only from two storages) is not part of the sample."
SEITE1_H8 = "After “Create a new token” in the plugin, adjust the addresses of the three output commands (or import the control template again) – otherwise the plugin answers with HTTP 403 and the storage stands still."
SEITE2_SCHRITT1 = "In the plugin, tab “Settings”, check: “Control active” switched on, power limits matching the model, “Auto fallback after” (default 30 minutes). Under “Spot prices (aWATTar)” choose the market Germany or Austria and enter the surcharge in ct/kWh."
SEITE2_SCHRITT2 = "Import VI_marstek_ranks.xml from the archive (once). Provide your own electricity meter as “Netzleistung (eigene Quelle)” – plus = import, minus = feed-in, in watts. If your meter delivers it the other way round, invert it first with a formula 0-I1."
SEITE2_SCHRITT3 = "Create the page “Marstek Venus E Steuerung” and drag the commands: battery power, state of charge, storage reachable (from “Marstek Status Venus E”, further instance), rank cheap, rank expensive, price negative (from “Marstek Ranks”), “Sollwert setzen (W, + lädt / - entlädt)” (from “Marstek steuern Venus E”), and “Netzleistung (eigene Quelle)”."
SEITE2_SCHRITT4 = "Create eight virtual inputs: five switches (no. 8–12) and three sliders (no. 13–15) with the limits and start values of the table."
SEITE2_SCHRITT5 = "Place and connect the other blocks via F5; OR and AND have two inputs each. Copy the formulas exactly (function names in capitals, separator “;”). Status “Speicher-Regelung jetzt”: click “+” once first (V5); enter the status rows by hand, the row without condition last."
SEITE2_SCHRITT6 = "Save and send, switch on “Speicher-Regelung ein” in the app. Check: in sunshine the status shows “charging surplus”, and about 100 W of feed-in remain at your own meter; in the plugin, tab “Test”, “loxone” appears under “Writers of the last 24 hours”."
SEITE2_H1 = "<b>On no. 16, 21 and 27:</b> the controller calculates with the own battery power (“Überschuss ohne Speicher” = battery power minus grid power). Up to 1.1.22 the list calculated only from the feed-in at the house meter: if the storage charges the surplus, the feed-in drops, and the setpoint swung every two minutes between the surplus and 0 W."
SEITE2_H2 = "<b>On no. 17 and 23:</b> “Less or Equal” with the rank at I1 and the number at I2: 1 if the current hour is among the set cheapest (or most expensive) ones. Up to 1.1.22 the charging-hours row was the wrong way round (number at I1) and charged in the expensive hours – if you built it that way, swap the two inputs. The second input is connected; the parameter V2 of the block then does not apply."
SEITE2_H3 = "<b>On no. 31 to 34:</b> “Senden erlaubt” (no. 32) drives the analog memory AND the dither: with the control switched off or a silent storage the output sends nothing more. The dither adds 0 and 1 alternately – otherwise the virtual output only sends on a change of value, and with an unchanged setpoint the watchdog (240 s) in the device would run out."
SEITE2_H4 = "Without “Speicher Entladung ins Hausnetz erlaubt” the storage only charges. With “Speicher nur in teuersten Stunden entladen” it discharges only in the set most expensive hours of the next 24 hours."
SEITE2_H5 = "Spot price charging needs BOTH switches (no. 9 and 10); at a negative price the storage then always charges with full power and never discharges."
SEITE2_H6 = "Venus E Mini: in formula no. 21 replace 2500 by 1500 and in no. 27 by 800 (otherwise the plugin limits by itself)."
SEITE2_H7 = "The setpoint goes out again every 120 s; if it stays away (LoxBerry or Miniserver off), the storage stops by itself after 240 s."
SEITE2_H8 = "If anybody besides Loxone sends setpoints (a second control, the aWATTar coupling), the Test tab shows it under “Writers of the last 24 hours” – then switch one off."
SEITE3_SCHRITT1 = "For the meters switch on Modbus TCP at the storage (only Venus E Gen 3.0 from firmware 144, only with LAN cable) and set “kWh meters (Modbus)” in the plugin, tab “Settings”. Without Modbus the lower half of the page stays empty – the status says so."
SEITE3_SCHRITT2 = "Import VI_marstek_energy.xml from the archive (once); “Marstek Ranks” is already there."
SEITE3_SCHRITT3 = "Create the page “Marstek Venus E Werte”, drag the 13 rank commands (no. 1–13; no. 3, 4 and 6 as further instance) and the 10 meter commands (no. 19–28); switch on “Statistics” at price of this hour, charged today and discharged today."
SEITE3_SCHRITT4 = "Create the notification “Meldung Marstek Spotpreise”, the other blocks via F5. “+”: “Preisfenster heute und morgen (Marstek)” four times (V5–V8), “Marstek heute und Monat” twice (V5, V6). Enter status rows and message text by hand."
SEITE3_SCHRITT5 = "Save and send. Check: compare “Strompreis jetzt (Marstek)” with tab “Test” → “Spot prices of all hours”."
SEITE3_H1 = "The prices are euros per kWh; the status blocks convert them to cents. The rank counts in the window from now to 24 hours ahead – in the evening, before the prices for tomorrow are there, these are fewer hours."
SEITE3_H2 = "The ranks come from the plugin itself (aWATTar Germany or Austria); the plugin “Spotpreis aWATTar” is not needed for them."
SEITE3_H3 = "Without Modbus the energy request answers with HTTP 503; “Marstek heute und Monat” then says what is missing (Modbus TCP, LAN cable, firmware from 144)."
