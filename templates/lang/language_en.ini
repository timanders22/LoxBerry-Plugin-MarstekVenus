RETAIN_ERKLAERUNG = "<b>Retain</b> means the broker keeps the last value and hands it to every new subscriber at once. States are sent that way so Loxone has the current picture right after a restart of the Miniserver or the gateway. Time-related readings — power, temperature, price of the hour — deliberately are not: otherwise an old value would look current after an outage. The heartbeat never is, because retained it would always read “alive”."
