SELBSTPRUEFUNG_ERKLAERUNG = "These lines answer <b>without Loxone</b> whether the installation works. A cross means <b>demonstrably not in order</b>. A dot is a hint: the line does not apply to this installation, or it <b>could not be determined</b> from here — for example when the web server rejects the call through 127.0.0.1. The lines that read the plugin's own files state how many places they looked at: a zero is then not a tick but a hint that nothing was measured."
