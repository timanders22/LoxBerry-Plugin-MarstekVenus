WAS_IST_DAS = "<b>MARSTEK Venus E batteries connected locally to Loxone – without cloud.</b> The plugin connects up to four batteries of the Venus E series (Venus E Gen 3.0 and Venus E Mini, mixed is possible) and delivers state of charge, power, temperature, firmware and response time to the Miniserver, plus a spot-hour ranking (aWATTar). Loxone remains the energy manager: the Miniserver decides and sends power setpoints in passive mode; the watchdog in the setpoint stops the battery if Loxone fails, and the optional auto fallback then hands control back to the auto mode of the device."

