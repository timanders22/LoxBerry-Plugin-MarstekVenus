GELEERT = "Log cleared from the web interface"
K_LEEREN = "Clear log"
H_CRONERR = "Error output of the minute task"
CRONERR_ERKLAERUNG = "This is where whatever the minute task writes to its error output ends up. Up to 1.0.16 it went nowhere — and with it the message cron.php produces when it cannot find its library."
CRONERR_LEER = "The error output is empty. That is the normal case."
H_EREIGNISSE = "What went wrong (survives reboot and cleanup)"
H_LAUFEND = "Running operation"
EREIGNISSE_ERKLAERUNG = "This holds <b>only</b> incidents and what the plugin did about them on its own: a setpoint that did not arrive, one that was retried, one that was discarded, a configuration restored from the backup copy. The file lives on the SD card and survives reboots, updates and LoxBerry's log maintenance — unlike the running log below. The button “Clear log” does not touch it."
EREIGNISSE_LEER = "Nothing went wrong — the list is empty."

