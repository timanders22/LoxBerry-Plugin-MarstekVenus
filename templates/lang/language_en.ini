; Marstek Venus E - language file, English
;
; English is the FALLBACK, not German: anyone running a third language is
; more likely to understand English. This file must therefore always be
; complete - every key that exists in language_de.ini exists here.
;
; RULES FOR EVERY VALUE HERE:
;   - one key carries a WHOLE sentence or a whole label, never a fragment
;   - short labels contain NO markup and NO entities; they are passed
;     through htmlspecialchars()
;   - markup is allowed only in the long explanatory texts that are printed
;     raw. There, attributes are quoted with SINGLE quotes (class='sm-mono') -
;     a double quote would end the value
;   - no addresses and no search patterns as text
;   - real UTF-8 characters

