H_STEUERUNG = "Master switch. When off the endpoint still accepts every setpoint but does not send it to the device; it answers with OK=0 and HINWEIS=STEUERUNG_AUS. Useful to leave the battery alone for a while without touching all the Loxone addresses."
H_UST = "The exchange price is multiplied by it. 1.19 for Germany, 1.20 for Austria."
