SATZ_ENERGY = "Energy meters (Modbus)"
SATZ_SUMME = "Sum across all batteries"
SATZ_STEUERN = "Control commands (virtual output)"
SP_EIGENSCHAFT = "Property"
SP_WERT = "Value"
SP_ADRESSE = "Address"
SP_TAKT = "Polling interval"
SP_SUCHTEXT = "Command recognition"
SP_EINHEIT = "Unit"
SP_BEDEUTUNG = "Meaning"
JE_GERAET = "For device 2 and up, create another virtual input with the same address and append dev=2 (%s&dev=2)."
S_AUSGANG = "Sending commands (virtual output)"
AUSGANG_TEXT = "The placeholder <span class='sm-mono'>&lt;v.0&gt;</span> is the desired power in whole watts: positive charges, negative discharges, 0 is idle. Without decimals – the endpoint only accepts whole numbers and rejects a value with decimals with HTTP 400. <span class='sm-mono'>t=240</span> is the watchdog — if no new command arrives, the battery stops by itself after 240 seconds. Send the setpoint again every 60 seconds. <b>Limits:</b> t is valid from 30 to 3600 seconds, p up to the power limit of the battery. Anything beyond is clamped, and the answer then carries <span class='sm-mono'>BEGRENZT=1</span>. <b>Command brake per battery:</b> the same setpoint (±1 W, same t) is not sent again within 60 s — the answer carries <span class='sm-mono'>UNVERAENDERT=1</span>; after 58 s at the latest it goes out again and renews the watchdog (with a small t after half of t). With the setting <b>minimum interval 10 s</b> (Settings tab, off by default) a different setpoint within 10 s is rejected with HTTP 429 and <span class='sm-mono'>WARTEN_S</span>. The same applies to mode. <b>Writer watch:</b> <span class='sm-mono'>von=loxone</span> tells the plugin that the command comes from the Miniserver; if anybody besides Loxone sends setpoints (the aWATTar coupling, for example), the Test tab shows it. An address without <span class='sm-mono'>von=</span> keeps working and shows up there as „no tag“."
SP_BEFEHL_ANALOG = "Command on ON (analogue)"
SP_BEFEHL_AUTO = "Command: hand control back"
TOKEN_WARNUNG = "<b>The token belongs in every one of these addresses.</b> The endpoint sits in the unauthenticated area so that the Miniserver can reach it without credentials — without a matching token it answers with HTTP 403. <b>A virtual output does not evaluate the answer:</b> a wrong token therefore goes unnoticed, the battery simply stands still."
S_AUSFALL = "Detecting failures"
AUSFALL_TEXT = "<b>A virtual input keeps its last value when the source is unreachable</b> — in the app everything then looks normal. Three commands of the template “Marstek Status Venus E” exist for this; the matching blocks are in step 6 on the page “Marstek Venus E” (no. 14 to 26): “Marstek Speicher erreichbar” says whether the battery answers. “Marstek Alter der Messung” says how old the last real measurement is — the numbers stay put during a fault instead of dropping to 0, and only the age reveals that they are old. “Marstek Herzschlag (vorige Runde)” advances by one on every minute task; if it stops, the task on the LoxBerry is no longer running, and then every other value is frozen."
S_BAUSTEINE = "Block lists to rebuild (three pages)"
BAUSTEINE_VORTEXT = "Three pages as in the LoxBerry plugins sample project: <b>“Marstek Venus E”</b> (is the storage running, messages, energy flow, manual mode) is needed by everybody, <b>“Marstek Venus E Steuerung”</b> only if Loxone controls the storage, <b>“Marstek Venus E Werte”</b> shows spot prices and energy meters. Per page: a box “How to take over this page”, the table, notes and a picture. The blocks are found in Loxone Config through the block search (key <b>F5</b>). The inputs column names the row number on the same page the signal comes from; commands that appear on two pages are inserted there as a further instance – no line crosses a page boundary. The control needs your own meter with the <b>grid power in watts</b>, import positive, feed-in negative."
SP_BAUSTEIN = "Block (type)"
SP_NAME = "Name (suggestion)"
SP_PARAMETER = "Parameter"
SP_EINGAENGE = "Connect inputs to"
S_GEGENPROBE = "Cross-check"
GEGENPROBE_TEXT = "After creating everything in the Miniserver: look at the command “Marstek Herzschlag (vorige Runde)”. It must change every minute. If it does, the whole path works — LoxBerry, endpoint and Miniserver. If it stands still, the Test tab helps: it calls the same endpoint through 127.0.0.1 and tells you whether the plugin or the path to it is at fault."
