K_AUTO = "Hand control back to the battery"
KNOEPFE_ERKLAERUNG = "<b>Fetch status</b> shows the raw answers of the device including model, firmware, response time and the time of the last real measurement. <b>Diagnosis</b> tries unicast, broadcast and Modbus one by one and says which path works. <b>Spot prices</b> lists every hourly price of the window together with the rank of the current hour. <b>Test discharging and charging</b> apply 800 W by hand: if the device reacts here, the battery is not the problem — the control from Loxone is."
