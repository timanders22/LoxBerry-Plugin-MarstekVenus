GERAETE_ERKLAERUNG = "Device 1 is the default; every call without a device number addresses it. Further batteries — a second Venus E or a <b>Venus E Mini</b> — simply go in the next row. The local API must be enabled on the device once; the default port is 30000. If you do not know the IP address, use the <b>Search for batteries on the network</b> button in the Test tab. <b>The row is the device number</b> (dev=N): clearing a row leaves the other batteries on their numbers."
GESTOERT = "FAULT"
GRENZEN_ERKLAERUNG = "<b>Power limits:</b> setpoints are clamped to them. Venus E Gen 3.0: 2500 W charging and discharging. Venus E Mini: 1500 W charging, 800 W discharging. — <b>Capacity:</b> needed only for the sum endpoint and deliberately without a default. If it is missing for one battery there is no weighted overall state of charge but -1: an unweighted average of two differently sized batteries would be a number that looks right and is not. — <b>kWh meters (Modbus):</b> from firmware 144 the Venus E Gen 3.0 can additionally be read over Modbus TCP through the LAN cable. Only switch this on if the device is wired. — <b>Model:</b> the choice pre-fills the power limits of the row (Venus E 2500/2500 W, Mini 1500/800 W; 'other' leaves them unchanged). If none is chosen, the detection from the device report applies. If a power limit is above that of the chosen or detected model, the settings are saved anyway with a yellow warning."
