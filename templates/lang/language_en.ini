H_BREMSE_ABSTAND = "A different setpoint or mode within 10 s of the last one sent is rejected with HTTP 429 and WARTEN_S and not sent — protection against a flapping Loxone output. Off by default, because a system that sends the setpoint on every change would otherwise lose commands. Independently of this, the same setpoint (±1 W, same t) always goes out only once within 60 s (UNVERAENDERT=1)."
UEB_WACHE = "Writer watch"
WACHE_ERKLAERUNG = "Only one controller should drive the battery – in this house that is Loxone. For every setpoint and every hand-back the watch remembers who sent it: the tag from <span class='sm-mono'>&amp;von=</span> (the Loxone template sets <span class='sm-mono'>von=loxone</span>) and the sender address. A call without a tag shows as „no tag“ – that is not an error, a template that has not been imported again shows up like this. The writers are listed on the Test tab."
L_WACHE_EIN = "Report several writers"
H_WACHE_EIN = "If setpoints from more than one writer arrive within the time window, this goes to the log (throttled), to the Test tab and into the answer (SCHREIBER=n). Nothing is rejected because of it. On by default."
L_WACHE_FENSTER = "Time window of the watch (minutes)"
H_WACHE_FENSTER = "1 to 120, 15 by default: longer than the gap of the slowest regular writer, shorter than the automatic fallback."
L_WACHE_LB = "Also report new writers to the notification centre"
H_WACHE_LB = "Only when a new set of writers appears, not on every repetition. Off by default."
L_WACHE_SPERREN = "Reject foreign writers"
H_WACHE_SPERREN = "A setpoint from a writer that is not in the list below gets HTTP 409 with GRUND=FREMDSCHREIBER and is not sent. A hand-back (mode=auto or ai) is never rejected. Setpoints via MQTT (command bridge) arrive as writer “mqtt”: if you only allow “loxone”, add “mqtt”, otherwise they are rejected as FREMDSCHREIBER. Off by default – switch it on only after the Test tab has shown nothing but the expected writers for a week."
L_WACHE_ERLAUBT = "Allowed writers"
H_WACHE_ERLAUBT = "Separated by commas, each entry a tag (loxone), an address (192.168.178.10) or both as tag@address (loxone@<address>). A call without a tag only matches by its address. At most 16 entries. With „Reject foreign writers“ at least one must be entered."
