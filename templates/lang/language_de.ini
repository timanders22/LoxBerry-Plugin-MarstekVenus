S1_TEXT = "<b>Das LoxBerry-Plugins Musterprojekt und die Baustein-Listen in Schritt 6 nutzen MQTT</b> – die Werte kommen über das MQTT-Gateway an einfache Virtuelle Eingänge (Namenstabelle in Schritt 2, keine Importvorlage), die Tasten Auto und AI gehen über die Befehlsbrücke des Plugins. Nur der Sollwert der Regelung bleibt vorerst beim HTTP-Ausgang mit Aktionstoken (Schritt 4). Bestehende Anlagen mit den HTTP-Vorlagen laufen unverändert weiter; deren Eingänge stehen unten unter „Für bestehende Anlagen: HTTP“."
