[LOX]
H_EINBINDUNG = "Einbindung in Loxone — Schritt für Schritt"
GRUNDGEDANKE = "<b>Loxone ist der Energiemanager, nicht das Plugin.</b> Das Plugin liefert Messwerte und Preise, der Miniserver entscheidet und sendet Leistungs-Sollwerte. Zwei Sicherheitsnetze liegen darunter: der Watchdog im Sollwert stoppt den Speicher, wenn aus Loxone nichts mehr kommt, und der Auto-Fallback gibt danach die Regie an den Auto-Modus des Geräts zurück."
