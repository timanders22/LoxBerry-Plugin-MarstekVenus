SEITE1_SCHRITT1 = "In der Marstek-App die lokale API („Open API“/„Lokaler Modus“) einschalten. Im Plugin Reiter „Test“ → „Speicher im Netz suchen“ → „In die Geräteliste übernehmen“, im Reiter „Einstellungen“ das Modell wählen und speichern. Im Reiter „MQTT“ „Werte zusätzlich per MQTT veröffentlichen“ einschalten und – für die Tasten Auto und AI – „Befehle über MQTT annehmen“."
SEITE1_SCHRITT2 = "Weiter oben in diesem Reiter, Schritt 2: die Eingänge dieser Seite als Virtuelle Eingänge anlegen (Virtuelle Eingänge anwählen → Virtueller Eingang; Bezeichnung genau wie in der Namenstabelle, Kopierknopf; „Als Digitaleingang verwenden“ nicht aktivieren). Für die Werte über das MQTT-Gateway gibt es keine Importvorlage. Der LoxBerry-Benutzer am Miniserver braucht Rechte auf die Eingänge. Schritt 3: unter Gateway Fassung 1 das Abo eintragen, unter Fassung 2 die Datenpunkte anhaken."
SEITE1_SCHRITT3 = "Seite „Marstek Venus E“ anlegen. Die 12 Eingänge (Nr. 1–12) auf die Seite ziehen, dazu die „Konstante 1“ aus dem Baum (Nr. 13). Die Eingänge heißen wie die Datenpunkte des MQTT-Gateways (marstek_…) – nicht umbenennen, sonst legt das Gateway einen zweiten Eingang an; den lesbaren Namen nennt die Spalte „Bedeutung“. Wer die Seite aus dem LoxBerry-Plugins Musterprojekt kopiert, bekommt die Eingänge mit."
SEITE1_SCHRITT4 = "Am gemeinsamen Ausgang „LoxBerry MQTT-Gateway“ (Virtueller Ausgang mit der Adresse /dev/udp/<LoxBerry>/11884; im Musterprojekt schon da) zwei Befehle anlegen: „Marstek Handbetrieb: Modus Auto“ mit Befehl bei EIN publish marstek/befehl/modus_auto 1 und „Marstek Handbetrieb: Modus AI“ mit publish marstek/befehl/modus_ai 1 (Nr. 33, 35; nie „retain“). Oder in Schritt 4 „Sollwert und Tasten Auto/AI (MQTT-Befehle)“ importieren – das legt einen eigenen Ausgang „Marstek MQTT-Befehle“ an. Benachrichtigung „Meldung Marstek Venus E“ anlegen (Peripherie → Mitteilungen → Benachrichtigung), Text wie in der Tabelle; zwei Virtuelle Eingänge als Taste (Nr. 32, 34)."
SEITE1_SCHRITT5 = "Übrige Bausteine über die Baustein-Suche (F5) setzen, Parameter wie in der Tabelle, von oben nach unten verbinden; ODER und UND haben je zwei Eingänge. Analogwertvalidierung Nr. 16: Haken bei ‚En‘ im Eigenschaftsfenster entfernen (Config legt En negiert an; sonst kommt die Konstante 1 als 0 an, und die Ausfallmeldung löst nie aus). Status „Marstek-Zustand“: vorher zweimal „+“ (V5, V6). Statuszeilen und Mitteilungstext stehen in der Tabelle und werden von Hand eingetragen, die Zeile ohne Bedingung zuletzt. An Ladezustand und Batterieleistung „Statistik“ einschalten; den Zähler für Speicher im Energiefluss-Monitor als Speicher eintragen."
SEITE1_SCHRITT6 = "Speichern und übertragen. Probe: „marstek_status_zaehler“ zählt jede Minute weiter; „Marstek-Zustand“ zeigt „erreichbar – Messung … s alt“. Eine Taste Auto oder AI drücken: im Plugin Reiter „Test“ steht unter „Befehlsbrücke“ der letzte Befehl mit „angenommen“."
SEITE1_H1 = "<b>Zu Nr. 16:</b> Die Analogwertvalidierung findet ein schweigendes Plugin: kommt innerhalb von Tmc kein neuer Wert von „marstek_status_zaehler“, meldet ihr Ausgang E. 600 s sind zehn Minutentakte – der UDP-Eingang des MQTT-Gateways verliert unter Last einzelne Datagramme, und ein einzelner Verlust soll nicht melden. Die Konstante 1 an En – und den Haken bei ‚En‘ im Eigenschaftsfenster entfernen."
SEITE1_H2 = "<b>Zu Nr. 17 bis 23:</b> Die Soll-Ist-Meldung prüft nur, solange Loxone sendet (Sollwert frisch, Nr. 18) – nach „Regelung aus“ meldet sie nicht. Nr. 17 blendet den Fehlwert -32768 („kein Sollwert“) aus; die 900 s an Nr. 23 schlucken auch den kurzen Impuls, den ein Schwellwertschalter bei jedem neuen Wert gibt."
SEITE1_H3 = "<b>Zu Nr. 24 bis 26:</b> Die Benachrichtigung sendet nur beim Wechsel von Aus auf Ein und bekommt genau eine Leitung – die drei Störungen laufen deshalb über zwei ODER (je zwei Eingänge) zusammen."
SEITE1_H4 = "Der Venus E antwortet zeitweise 20 bis 60 Sekunden lang niemandem – deshalb meldet die Seite erst nach 15 Minuten."
SEITE1_H5 = "Die Tasten Auto und AI wirken nur bei ausgeschalteter Regelung (Seite „Marstek Venus E Steuerung“); sonst setzt Loxone nach spätestens 60 s wieder einen Sollwert. Über MQTT brauchen sie im Plugin „Befehle über MQTT annehmen“ und „Steuerung aktiv“; dieselbe Taste wirkt innerhalb einer Minute nur einmal."
SEITE1_H6 = "„Marstek Netzleistung“ ist die Leistung am Anschluss des Speichers, nicht der Hauszähler – für die Regelung zählt der eigene Zähler."
SEITE1_H7 = "Mehrere Speicher: die Namenstabelle in Schritt 2 führt je Speicher eigene Namen (Gerät 2 und folgende tragen die Nummer: marstek_2_soc …); die Tasten heißen dort marstek/befehl/2/modus_auto usw. Störungen über weitere ODER (je zwei Eingänge) vor die Benachrichtigung – nie mehrere Quellen direkt an sie. Die Vorlage „Marstek Summe“ (erst ab zwei Speichern, nur HTTP) gehört nicht zum Muster."
SEITE1_H8 = "„marstek_ok“ altert über MQTT nicht von selbst: stirbt der Minutentakt, bliebe die 1 stehen – genau dafür meldet Nr. 16 das fehlende Lebenszeichen. Bestehende Anlagen mit den HTTP-Vorlagen laufen unverändert weiter (Abschnitt „Für bestehende Anlagen: HTTP“ unten)."
SEITE2_SCHRITT1 = "Im Plugin Reiter „Einstellungen“ prüfen: „Steuerung aktiv“ eingeschaltet, Leistungsgrenzen passend zum Modell, „Auto-Fallback nach“ (ab Werk 30 Minuten). Unter „Spotpreise (aWATTar)“ den Markt Deutschland oder Österreich wählen und den Aufschlag in ct/kWh eintragen. Im Reiter „MQTT“ „Befehle über MQTT annehmen“ einschalten – Nr. 40 zeigt, dass der Befehlsdienst läuft."
SEITE2_SCHRITT2 = "Die Rang-Eingänge dieser Seite nach der Namenstabelle in Schritt 2 oben anlegen (Virtueller Eingang, Name genau so). Am gemeinsamen Ausgang „LoxBerry MQTT-Gateway“ den Befehl „Marstek Sollwert senden“ anlegen: Befehl bei Analogwert publish marstek/befehl/sollwert <v.0> (Nr. 35; nie „retain“) – oder in Schritt 4 oben „Sollwert und Tasten Auto/AI (MQTT-Befehle)“ importieren. Den eigenen Stromzähler als „Netzleistung (eigene Quelle)“ bereitstellen – plus = Bezug, minus = Einspeisung, in Watt. Liefert der Zähler es andersherum, vorher mit einer Formel 0-I1 umdrehen."
SEITE2_SCHRITT3 = "Seite „Marstek Venus E Steuerung“ anlegen und die Eingänge ziehen: marstek_batp, marstek_soc, marstek_ok, marstek_sollalter und marstek_status_befehle (weitere Instanz der Eingänge von Seite „Marstek Venus E“), marstek_rang_rank, marstek_rang_rankd, marstek_rang_neg, „Marstek Sollwert senden“ (Befehl am Ausgang „LoxBerry MQTT-Gateway“), dazu „Netzleistung (eigene Quelle)“."
SEITE2_SCHRITT4 = "Neun Virtuelle Eingänge anlegen: fünf Schalter (Nr. 8–12), drei Schieberegler (Nr. 13–15) mit den Grenzen und Startwerten der Tabelle und „Wallbox-Ladeleistung (eigene Quelle)“ (Nr. 37; ohne Wallbox 0 lassen)."
SEITE2_SCHRITT5 = "Übrige Bausteine über F5 setzen und verbinden; ODER und UND haben je zwei Eingänge. Formeln genau so abschreiben (Funktionsnamen groß, Trennzeichen „;“). Status „Speicher-Regelung jetzt“: vorher dreimal „+“ (V5–V7); Statuszeilen von Hand eintragen, die Zeile ohne Bedingung zuletzt. Benachrichtigung „Meldung Marstek Sollwert kommt nicht an“ (Nr. 45) anlegen."
SEITE2_SCHRITT6 = "Spot-Ersparnis (Nr. 46–62, nur mit dem Plugin „Spotpreis aWATTar“): dessen Eingänge spot_awattar_cur und spot_awattar_avg_heute (Gateway-Namen, siehe dort) als weitere Instanz ziehen. „Wochentag“ steht im Baum unter „Zeitfunktionen“. An den Analogspeichern Nr. 51 und 58 „Remanenz“ einschalten. Status Nr. 60 „Visualisierung“ aus, Nr. 62 ein; die Benachrichtigung Nr. 61 bekommt den Statustext von Nr. 60 (Ausgang TQ)."
SEITE2_H1 = "<b>Zu Nr. 16, 21 und 27:</b> Der Regler rechnet mit der eigenen Batterieleistung („Überschuss ohne Speicher“ = Batterieleistung minus Netzleistung). Bis 1.1.22 rechnete die Liste nur aus der Einspeisung am Hauszähler: lädt der Speicher den Überschuss, fällt die Einspeisung, und der Sollwert pendelte im Zwei-Minuten-Takt zwischen Überschuss und 0 W."
SEITE2_H2 = "<b>Zu Nr. 17 und 23:</b> „Kleiner oder gleich“ mit dem Rang an I1 und der Anzahl an I2: 1, wenn die laufende Stunde unter den eingestellten günstigsten (bzw. teuersten) liegt. Bis 1.1.22 stand die Ladestunden-Zeile verkehrt herum da (Anzahl an I1) und lud in den teuren Stunden – wer danach gebaut hat, tauscht die beiden Eingänge. Der zweite Eingang ist verbunden; der Parameter V2 am Baustein gilt dann nicht."
SEITE2_H3 = "<b>Zu Nr. 31 bis 34:</b> „Senden erlaubt“ (Nr. 32) treibt den Analogspeicher UND den Dither: bei ausgeschalteter Regelung oder stummem Speicher sendet der Ausgang nichts mehr. Der Dither addiert abwechselnd 0 und 1 – sonst sendet der Virtuelle Ausgang nur bei Wertänderung, und bei gleichbleibendem Sollwert liefe der Watchdog (240 s) im Gerät ab. Der Sendetakt ist 30 s: Mit Gateway Fassung 1 verliert der UDP-Eingang unter Last Datagramme; der Speicher bleibt erst nach sieben verlorenen Sollwerten in Folge stehen."
SEITE2_H4 = "Ohne „Speicher Entladung ins Hausnetz erlaubt“ lädt der Speicher nur. Mit „Speicher nur in teuersten Stunden entladen“ entlädt er nur in den eingestellten teuersten Stunden der nächsten 24 Stunden."
SEITE2_H5 = "Spotpreis-Laden braucht BEIDE Schalter (Nr. 9 und 10); bei negativem Preis lädt der Speicher dann immer mit voller Leistung und entlädt nie."
SEITE2_H6 = "Venus E Mini: in der Formel Nr. 21 die 2500 durch 1500 und in Nr. 27 durch 800 ersetzen (das Plugin begrenzt sonst selbst)."
SEITE2_H7 = "Der Sollwert geht alle 30 s neu hinaus (das Plugin gibt denselben Wert höchstens alle 58 s an den Speicher weiter); bleibt er aus (LoxBerry oder Miniserver aus), stoppt der Speicher nach 240 s von selbst."
SEITE2_H8 = "Sendet außer Loxone noch jemand Sollwerte (eine zweite Regelung, die aWATTar-Kopplung), steht das im Reiter Test unter „Schreiber der letzten 24 Stunden“ – dann eine abschalten."
SEITE3_SCHRITT1 = "Für die Zähler am Speicher Modbus TCP einschalten (nur Venus E Gen 3.0 ab Firmware 144, nur mit LAN-Kabel) und im Plugin Reiter „Einstellungen“ „kWh-Zähler (Modbus)“ setzen. Ohne Modbus bleibt die untere Hälfte der Seite leer – der Status sagt es."
SEITE3_SCHRITT2 = "Die 10 Zähler-Eingänge (marstek_energie_…) nach der Namenstabelle in Schritt 2 oben als Virtuelle Eingänge anlegen; die Rang-Eingänge sind von der Seite „Marstek Venus E Steuerung“ schon da."
SEITE3_SCHRITT3 = "Seite „Marstek Venus E Werte“ anlegen, die 13 Rangbefehle (Nr. 1–13; Nr. 3, 4 und 6 als weitere Instanz) und die 10 Zählerbefehle (Nr. 19–28) ziehen; „Statistik“ an Preis dieser Stunde, geladen heute und abgegeben heute einschalten."
SEITE3_SCHRITT4 = "Benachrichtigung „Meldung Marstek Spotpreise“ anlegen, übrige Bausteine über F5. „+“: „Preisfenster heute und morgen (Marstek)“ viermal (V5–V8), „Marstek heute und Monat“ zweimal (V5, V6). Statuszeilen und Mitteilungstext von Hand eintragen."
SEITE3_SCHRITT5 = "Monatsbilanz (Nr. 31–37): „Monatsimpuls“ im Baum unter „Zeitfunktionen“ auf die Seite ziehen (Config vergibt den Namen fest). An den Analogspeichern Nr. 33 und 34 „Remanenz“ einschalten. Status Nr. 36: einmal „+“ (V4), „Visualisierung“ aus; die Benachrichtigung Nr. 37 bekommt den Statustext von Nr. 36 (Ausgang TQ)."
SEITE3_H1 = "Die Preise sind Euro je kWh; die Status rechnen sie in Cent um. Der Rang zählt im Fenster von jetzt bis 24 Stunden voraus – abends, bevor die Preise für morgen da sind, sind es weniger Stunden."
SEITE3_H2 = "Die Ränge stammen aus dem Plugin selbst (aWATTar Deutschland oder Österreich); das Plugin „Spotpreis aWATTar“ ist dafür nicht nötig."
SEITE3_H3 = "Ohne Modbus kommen über MQTT nur „Zähler gültig“ 0 und „Alter der Zählerstände“ -1 (halbstündlich); „Marstek heute und Monat“ sagt dann, was fehlt (Modbus TCP, LAN-Kabel, Firmware ab 144). Noch nie gelesene Zählerstände stehen auf -1."
