S1_TITEL = "MQTT einschalten"
S_ABO = "Abo und Datenpunkte im MQTT-Gateway"
S_EINGAENGE = "Virtuelle Eingänge (HTTP)"
S1_TEXT = "<b>Das LoxBerry-Plugins Musterprojekt und die Baustein-Listen in Schritt 6 nutzen MQTT</b> – die Werte kommen über das MQTT-Gateway an einfache Virtuelle Eingänge (Namenstabelle in Schritt 2, keine Importvorlage), der Sollwert der Regelung und die Tasten Auto und AI gehen über die Befehlsbrücke des Plugins (Schritt 4). Bestehende Anlagen mit den HTTP-Vorlagen laufen unverändert weiter; deren Eingänge stehen unten unter „Für bestehende Anlagen: HTTP“."
SATZ_STATUS = "Status (Ladezustand, Leistung, Temperatur)"
