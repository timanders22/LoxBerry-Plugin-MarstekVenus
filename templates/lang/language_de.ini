SEITE2_SCHRITT7 = "Speichern und übertragen, in der App „Speicher-Regelung ein“ einschalten. Probe: bei Sonne zeigt der Status „lädt Überschuss“, und am eigenen Zähler bleiben etwa 100 W Einspeisung; im Plugin Reiter „Test“ steht unter „Schreiber der letzten 24 Stunden“ „loxone“."
SEITE2_H9 = "<b>Zu Nr. 35:</b> Der Sollwert bleibt vorerst beim HTTP-Weg (Vorlage „Marstek steuern Venus E“ mit Aktionstoken). Die Befehlsbrücke des Plugins kennt ihn schon als marstek/befehl/sollwert, dort ist er aber ab Werk gesperrt – Freigabe nach Messung der UDP-Verluste des MQTT-Gateways."
SEITE2_H10 = "<b>Zu Nr. 37 und 38:</b> Lädt eine Wallbox, rechnet Nr. 38 ihre Leistung dem Überschuss gut – der Speicher entlädt dann nicht ins Auto. Lädt die Wallbox aus PV-Überschuss, sinkt der Ladewunsch Nr. 21: das Auto hat Vorrang."
SEITE2_H11 = "<b>Zu Nr. 39 bis 45:</b> Kommt bei eingeschalteter Regelung zehn Minuten lang kein Sollwert am Speicher an (Alter des Sollwerts über 300 s), meldet Nr. 45. Die 600 s an Nr. 44 schlucken den Anlauf und die Schweigefenster des Speichers."
SEITE2_H12 = "<b>Zu Nr. 46 bis 62:</b> Die Ersparnis zählt Entladen über dem Tagesmittel und Netzladen darunter (Preise aus dem Plugin „Spotpreis aWATTar“; ct/kWh × W / 100000 = EUR/h); Laden aus PV zählt nicht. Montags um 8 Uhr kommt eine Push mit der Ersparnis der Vorwoche; die Summe übersteht einen Stromausfall dank Remanenz."
SEITE3_SCHRITT6 = "Speichern und übertragen. Probe: „Strompreis jetzt (Marstek)“ mit dem Reiter „Test“ → „Spotpreise aller Stunden“ vergleichen."
SEITE3_H4 = "„Zähler gültig“ und „Alter der Zählerstände“ kommen jede Minute; „Zähler gültig“ fällt nach 900 s ohne frische Zählerstände auf 0 (wie am HTTP-Endpunkt). Preise und Zählerstände selbst kommen bei Änderung, spätestens halbstündlich."
SEITE3_H5 = "<b>Zu Nr. 31 bis 37:</b> Um 23:55 übernehmen die Analogspeicher die Monatswerte, aber nur bei frischen Zählern; am Monatsersten um 0:00 kommt die Push mit dem Vormonat – das Plugin hat die Monatszähler dann schon auf 0 gesetzt."
MQTT_VORAUS = "Im Plugin Reiter MQTT den Haken ‚Werte zusätzlich per MQTT veröffentlichen‘ setzen. Er ist ab Werk aus. Ohne ihn kommt über das Gateway nichts an."
