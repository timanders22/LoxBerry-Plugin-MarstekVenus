WAS_IST_DAS = "<b>MARSTEK-Venus-E-Batteriespeicher lokal an Loxone – ohne Cloud.</b> Das Plugin bindet bis zu vier Speicher der Venus-E-Serie an (Venus E Gen 3.0 und Venus E Mini, gemischt möglich) und liefert dem Miniserver Ladezustand, Leistung, Temperatur, Firmware und Antwortzeit sowie ein Spot-Stunden-Ranking (aWATTar). Loxone bleibt der Energiemanager: Der Miniserver entscheidet und sendet Leistungs-Sollwerte im Passiv-Modus; der Watchdog im Sollwert stoppt den Speicher, wenn Loxone ausfällt, und der optionale Auto-Fallback gibt danach die Regie an den Auto-Modus des Geräts zurück."

