; Marstek Venus E - Sprachdatei Deutsch
;
; NEU GESCHNITTEN am 24.08.2026. Bis 1.0.16 bestanden 89 von 390 Werten aus
; Satzfragmenten, Adressen oder Markup - darunter AUS = ">aus", also das
; schliessende Groesserzeichen eines HTML-Tags. Ein fehlender Schluessel haette
; dort kein sichtbares TEXT.AUS erzeugt, sondern den Eintrag aus der
; Auswahlliste verschwinden lassen, ohne dass irgendwo ein Fehler steht.
;
; REGELN FUER JEDEN WERT HIER:
;   - Ein Schluessel traegt einen GANZEN Satz oder eine ganze Beschriftung,
;     nie ein Bruchstueck.
;   - Kurze Beschriftungen enthalten KEIN Markup und KEINE Entitaeten; sie
;     laufen durch htmlspecialchars().
;   - Auszeichnung ist nur in den langen Erklaertexten erlaubt, die roh
;     ausgegeben werden. Dort werden Attribute EINFACH quotiert
;     (class='sm-mono') - ein doppeltes Anfuehrungszeichen beendet den Wert.
;   - Keine Adressen und keine Suchmuster als Text. Sie kaemen sonst in eine
;     Uebersetzung und braechen den Endpunkt.
;   - Echte UTF-8-Umlaute, keine Umschrift.
;
; Geprueft mit Werkzeuge/ini_pruefen.py (alle drei Lesemodi zeichengleich).

