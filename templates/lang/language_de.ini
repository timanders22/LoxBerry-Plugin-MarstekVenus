ABO_V1_MQTT = "<b>Gateway Fassung 1:</b> Unter <i>MQTT Gateway → Abonnements</i> die Zeile <span class='sm-mono'>%s/#</span> eintragen und speichern. Ohne diesen Eintrag kommt am Miniserver nichts an. Das Plugin meldet dasselbe Abo zusätzlich über seine Datei mqtt_subscriptions.cfg; ein eigener Eintrag schadet nicht."
ABO_V2_MQTT = "<b>Gateway Fassung 2:</b> Unter <i>MQTT Gateway → Abonnements</i> erscheint die Gruppe <span class='sm-mono'>%s</span> von selbst. Diese Datenpunkte anhaken (Tabelle unten). Bei den mit ‚N‘ markierten zusätzlich ‚Noncached‘ setzen: Sie senden oft denselben Wert, und ohne die Einstellung fehlen sie nach einem Neustart des Miniservers, bis sie sich ändern. Keinen Datenpunkt ‚Zurücksetzen nach Senden‘ setzen: ‚Speicher erreichbar‘ fiele sonst nach jedem Wert auf 0, und die Seite meldete eine Störung."
HAKEN_TITEL = "Datenpunkte zum Anhaken (Gateway Fassung 2)"
