BEFEHLE_SOLL_TEXT = "<b>Sollwert der Regelung über MQTT (seit 1.1.26):</b> Der Sollwert geht wie die Tasten über MQTT: <span class='sm-mono'>publish marstek/befehl/sollwert &lt;v.0&gt;</span> am gemeinsamen Ausgang „LoxBerry MQTT-Gateway“ (Tabelle und Vorlage unter „Sollwert und Tasten über MQTT“). Er braucht im Plugin den Haken „Befehle über MQTT annehmen“ (Reiter MQTT) und „Steuerung aktiv“ (Reiter Einstellungen). Mit Gateway Fassung 1 verliert der UDP-Eingang unter Last Datagramme. Der 30-s-Takt fängt das ab: Der Speicher bleibt erst nach sieben verlorenen Sollwerten in Folge stehen. <b>Für bestehende Anlagen</b> bleibt der HTTP-Weg erhalten: der virtuelle Ausgang mit Aktionstoken (Vorlage „Marstek steuern Venus E“) mit diesen Adressen."
BEFEHLE_MQTT_TEXT = "<b>Sollwert und Tasten über MQTT:</b> Loxone sendet <span class='sm-mono'>publish &lt;Thema&gt; 1</span> (Tasten) bzw. <span class='sm-mono'>publish &lt;Thema&gt; &lt;v.0&gt;</span> (Sollwert) an den UDP-Eingang des MQTT-Gateways (Port %d); die Befehlsbrücke des Plugins nimmt den Befehl an, prüft ihn und gibt ihn an dieselbe Funktion wie der HTTP-Weg. Unter Gateway Fassung 1 und 2 ist dafür nichts einzutragen oder anzuhaken. Nie „retain“ statt „publish“ – ein zurückbehaltener Befehl wird verworfen."
