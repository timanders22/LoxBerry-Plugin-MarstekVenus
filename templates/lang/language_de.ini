S_AUSGANG = "Befehle senden (virtueller Ausgang)"
AUSGANG_TEXT = "Der Platzhalter <span class='sm-mono'>&lt;v&gt;</span> ist die gewünschte Leistung in Watt: positiv lädt, negativ entlädt, 0 ist Leerlauf. <span class='sm-mono'>t=240</span> ist der Watchdog — bleibt ein neuer Befehl aus, stoppt der Speicher nach 240 Sekunden von selbst. Deshalb den Sollwert alle 60 Sekunden neu senden."
SP_BEFEHL_ANALOG = "Befehl bei EIN (analog)"
SP_BEFEHL_AUTO = "Befehl: Regie zurückgeben"
TOKEN_WARNUNG = "<b>Das Token gehört in jede dieser Adressen.</b> Der Endpunkt liegt im unangemeldeten Bereich, damit der Miniserver ihn ohne Zugangsdaten erreicht — ohne passendes Token antwortet er mit HTTP 403. <b>Ein virtueller Ausgang wertet die Antwort nicht aus:</b> ein falsches Token fällt deshalb nicht auf, der Speicher steht einfach still."
S_AUSFALL = "Ausfallerkennung"
AUSFALL_TEXT = "<b>Ein virtueller Eingang behält bei Nichterreichbarkeit seinen letzten Wert</b> — in der App sieht dann alles normal aus. Drei Felder sind dafür da, und die zugehörigen Bausteine stehen unten in der Liste: <span class='sm-mono'>MARSTEK_STATUS_OK</span> sagt, ob der Speicher antwortet. <span class='sm-mono'>MARSTEK_STATUS_ALTER</span> sagt, wie alt die letzte echte Messung ist — die Zahlen bleiben bei einer Störung stehen, statt auf 0 zu fallen, und nur das Alter verrät, dass sie alt sind. <span class='sm-mono'>MARSTEK_STATUS_ZAEHLER</span> läuft bei jedem Minutentakt eine Stelle weiter; bleibt er stehen, läuft der Takt auf dem LoxBerry nicht mehr, und dann sind alle übrigen Werte eingefroren."
S_BAUSTEINE = "Komplette Baustein-Liste zum Nachbauen"
BAUSTEINE_VORTEXT = "So ist die Logik im Referenzprojekt gebaut. Voraussetzung ist ein Zähler, der die <b>Netzleistung in Watt</b> liefert, mit Bezug positiv und Einspeisung negativ. Die Bausteine finden sich in Loxone Config über die Baustein-Suche (Taste <b>F5</b>). Die Spalte Eingänge nennt die Nummer der Zeile, aus der das Signal kommt."
BAUSTEINE_NACHTEXT = "<b>Zu #35 und #37:</b> Der Analogspeicher hält den Sollwert fest, und der Dither-Impuls addiert abwechselnd 0 und 1. Ohne diesen Kunstgriff sendet der virtuelle Ausgang nur bei Wertänderung — bleibt der Sollwert eine Stunde gleich, läuft der Watchdog im Gerät ab und der Speicher stoppt. <b>Zu #39:</b> Der Benachrichtigungs-Baustein sendet nur beim Wechsel von Aus auf Ein. Niemals mehrere Quellen direkt an seinen Eingang — erst über ODER zusammenführen, sonst verschluckt eine dauerhaft aktive Quelle alle übrigen. <b>Zu #40:</b> Die Änderungsüberwachung auf MARSTEK_STATUS_ZAEHLER ist die einzige Zeile, die einen stehengebliebenen Minutentakt findet. <b>Zu #41:</b> Nimmt der Speicher den Sollwert an, ohne ihn umzusetzen, weichen MARSTEK_STATUS_SOLL und MARSTEK_STATUS_BATP dauerhaft voneinander ab — genau dafür ist diese Zeile da."
