S_AUSGANG = "Befehle senden"
AUSGANG_TEXT = "Der Platzhalter <span class='sm-mono'>&lt;v.0&gt;</span> ist die gewünschte Leistung in ganzen Watt: positiv lädt, negativ entlädt, 0 ist Leerlauf. Ohne Nachkommastelle – der Endpunkt nimmt nur ganze Zahlen und weist einen Wert mit Komma mit HTTP 400 ab. <span class='sm-mono'>t=240</span> ist der Watchdog — bleibt ein neuer Befehl aus, stoppt der Speicher nach 240 Sekunden von selbst. Deshalb den Sollwert spätestens alle 60 Sekunden neu senden – das Musterprojekt sendet alle 30 Sekunden. <b>Grenzen:</b> t gilt von 30 bis 3600 Sekunden, p bis zur Leistungsgrenze des Speichers. Was darüber liegt, wird begrenzt, und die Antwort trägt dann <span class='sm-mono'>BEGRENZT=1</span>. <b>Befehlsbremse je Speicher:</b> Derselbe Sollwert (±1 W, gleiches t) geht innerhalb von 60 s nicht erneut hinaus — die Antwort trägt <span class='sm-mono'>UNVERAENDERT=1</span>; spätestens nach 58 s geht er wieder hinaus und erneuert den Watchdog (bei kleinem t nach der Hälfte von t). Mit der Einstellung <b>Mindestabstand 10 s</b> (Reiter Einstellungen, ab Werk aus) wird ein anderer Sollwert innerhalb von 10 s mit HTTP 429 und <span class='sm-mono'>WARTEN_S</span> abgewiesen. Dasselbe gilt für mode. <b>Schreiber-Wache:</b> <span class='sm-mono'>von=loxone</span> sagt dem Plugin, dass der Befehl vom Miniserver kommt; sendet außer Loxone noch jemand Sollwerte (etwa die aWATTar-Kopplung), steht das im Reiter Test. Eine Adresse ohne <span class='sm-mono'>von=</span> funktioniert weiter und erscheint dort als „ohne Kennung“."
SP_BEFEHL_ANALOG = "Befehl bei EIN (analog)"
SP_BEFEHL_AUTO = "Befehl: Regie zurückgeben"
TOKEN_WARNUNG = "<b>Das Token gehört in jede dieser Adressen.</b> Der Endpunkt liegt im unangemeldeten Bereich, damit der Miniserver ihn ohne Zugangsdaten erreicht — ohne passendes Token antwortet er mit HTTP 403. <b>Ein virtueller Ausgang wertet die Antwort nicht aus:</b> ein falsches Token fällt deshalb nicht auf, der Speicher steht einfach still."
S_AUSFALL = "Ausfallerkennung"
AUSFALL_TEXT = "<b>Ein virtueller Eingang behält bei Nichterreichbarkeit seinen letzten Wert</b> — in der App sieht dann alles normal aus. Drei Eingänge aus der Namenstabelle sind dafür da; die zugehörigen Bausteine stehen in Schritt 6 auf der Seite „Marstek Venus E“ (Nr. 14 bis 26): „marstek_ok“ sagt, ob der Speicher antwortet. „marstek_alter“ sagt, wie alt die letzte echte Messung ist — die Zahlen bleiben bei einer Störung stehen, statt auf 0 zu fallen, und nur das Alter verrät, dass sie alt sind. „marstek_status_zaehler“ ist das Lebenszeichen des Plugins und läuft bei jedem Minutentakt eine Stelle weiter. Ein Eingang über MQTT altert nicht von selbst; deshalb prüft die Analogwertvalidierung (Nr. 16), ob das Lebenszeichen weiterläuft, und meldet nach 600 s Stillstand (Minutentakt oder MQTT-Gateway steht)."
S_BAUSTEINE = "Baustein-Listen zum Nachbauen (drei Seiten)"
BAUSTEINE_VORTEXT = "Drei Seiten wie im LoxBerry-Plugins Musterprojekt: <b>„Marstek Venus E“</b> (läuft der Speicher, Meldungen, Energiefluss, Handbetrieb) braucht jeder, <b>„Marstek Venus E Steuerung“</b> nur, wer Loxone den Speicher regeln lässt, <b>„Marstek Venus E Werte“</b> zeigt Spotpreise und Energiezähler. Je Seite: ein Kasten „So übernehmen Sie diese Seite“, die Tabelle, Hinweise und ein Bild. Die Bausteine finden sich in Loxone Config über die Baustein-Suche (Taste <b>F5</b>). Die Spalte Eingänge nennt die Nummer der Zeile auf derselben Seite, aus der das Signal kommt; Befehle, die auf zwei Seiten stehen, sind dort als weitere Instanz eingefügt – keine Leitung geht über eine Seitengrenze. Die Regelung braucht einen eigenen Zähler mit der <b>Netzleistung in Watt</b>, Bezug positiv, Einspeisung negativ."
SP_BAUSTEIN = "Baustein (Typ)"
SP_NAME = "Name (Vorschlag)"
SP_PARAMETER = "Parameter"
SP_EINGAENGE = "Eingänge verbinden mit"
S_GEGENPROBE = "Gegenprobe"
GEGENPROBE_TEXT = "Nach dem Anlegen im Miniserver: den Eingang „marstek_status_zaehler“ ansehen. Er muss sich jede Minute ändern. Tut er das, steht der ganze Weg — Plugin, MQTT-Gateway und Miniserver. Bleibt er stehen, hilft der Reiter Test weiter: er sagt, ob der Minutentakt läuft, ob MQTT eingeschaltet ist und ob das Gateway läuft. Für die Tasten: eine Taste drücken – im Reiter Test steht unter „Befehlsbrücke“ der letzte Befehl mit seinem Ergebnis."
