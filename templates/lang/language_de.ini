H_VORLAGEN = "Alles auf einmal anlegen"
VORLAGEN_ERKLAERUNG = "Statt jeden Wert von Hand als virtuellen Eingang anzulegen: eine Datei mit allen Werten samt Einheit, Grenzen und Kommentar. <b>Achtung:</b> Loxone Config legt beim Import neu an und überschreibt nichts — zweimal eingelesen ergibt doppelte Bausteine. Die Adresse im Kopf jeder Datei ist ein Vorschlag; bitte prüfen, ob der Miniserver den LoxBerry unter diesem Namen erreicht. <b>Die Steuervorlagen enthalten das Aktionstoken im Klartext.</b>"
