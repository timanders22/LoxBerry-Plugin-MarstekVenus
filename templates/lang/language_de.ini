HAKEN_NICHT = "Nicht anhaken: zaehler, ts, takt_zaehler, takt_ts, status/ok und status/ts (keine Musterseite braucht sie) und die Befehlsthemen %s/befehl/… samt Quittungen."
BEFEHLE_SOLL_TEXT = "<b>Sollwert der Regelung (vorerst HTTP):</b> Der Sollwert gilt am Speicher nur 240 s, und der UDP-Eingang des MQTT-Gateways verliert unter Last Datagramme. Er bleibt deshalb beim virtuellen Ausgang mit Aktionstoken (Vorlage „Marstek steuern Venus E“), bis eine Messung der Verluste den MQTT-Weg freigibt."
BEFEHLE_MQTT_TEXT = "<b>Tasten über MQTT:</b> Loxone sendet <span class='sm-mono'>publish &lt;Thema&gt; 1</span> an den UDP-Eingang des MQTT-Gateways (Port %d); die Befehlsbrücke des Plugins nimmt den Befehl an, prüft ihn und gibt ihn an dieselbe Funktion wie der HTTP-Weg. Unter Gateway Fassung 1 und 2 ist dafür nichts einzutragen oder anzuhaken. Nie „retain“ statt „publish“ – ein zurückbehaltener Befehl wird verworfen."
BEFEHLE_ZUSTAND_AN = "Befehle über MQTT annehmen: eingeschaltet."
BEFEHLE_ZUSTAND_AUS = "Befehle über MQTT annehmen: ausgeschaltet (ab Werk) – im Reiter MQTT einschalten."
H_HTTP = "Für bestehende Anlagen: HTTP"
HTTP_TEXT = "Wer die HTTP-Vorlagen schon eingelesen hat, muss nichts umstellen: der Endpunkt liefert dieselben Werte weiter. Diese Eingänge fragen das Plugin im Abfragezyklus ab und erkennen ihre Werte an der Befehlserkennung. Neu anlegen nur nach dem MQTT-Weg oben – beide Wege für denselben Behälter ergäben doppelte Bausteine."

