H_HAUS_SPEICHER = "Ab Werk aus; wirkt nur mit „Werte über MQTT veröffentlichen“. Nur ein Speicher-Plugin im Haus ist Anbieter: diese Installation beginnt von selbst nur, wenn kein anderer Anbieter da ist; sonst wartet sie, bis Sie unten „Diese Installation soll Anbieter sein“ drücken. Liest später: Sprachsteuerung („Wie voll ist der Speicher?“). Beim Ausschalten räumt das Plugin die Themen wieder ab – nur, wenn diese Installation Anbieter war."
