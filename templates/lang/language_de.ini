S_NAMEN = "Virtuelle Eingänge anlegen (Namenstabelle)"
NAMEN_TEXT = "Für die Werte über das MQTT-Gateway gibt es <b>keine Importvorlage</b> – die LoxBerry-Anleitung zum MQTT-Gateway verlangt einen einfachen „Virtuellen Eingang“, keinen „Virtuellen HTTP-Eingang“. In Loxone Config je Zeile einen <b>Virtuellen Eingang</b> anlegen (Virtuelle Eingänge anwählen → Virtueller Eingang), für einen Text einen Virtuellen Texteingang. Als Bezeichnung <b>genau</b> den Namen aus der Tabelle eintragen (Knopf „Kopieren“) – ein anderer Name ergibt beim ersten Wert einen zweiten Eingang. „Als Digitaleingang verwenden“ <b>nicht</b> aktivieren, auch nicht bei den 0/1-Werten. Den lesbaren Namen für die App (Spalte „Bedeutung“) gibt man in Loxone von Hand."
