[AUTOUPDATE]
; Vorabfassungen. Solange keine eigene gepflegt wird, steht hier dieselbe
; Fassung und stehen hier dieselben Adressen wie in der release.cfg. Eine
; prerelease.cfg OHNE VERSION-Zeile waere der schlechteste Fall: wird sie doch
; einmal abgerufen, ist das Verhalten undefiniert.
# Diese Datei liegt im Wurzelverzeichnis des GitHub-Repositories und
# steuert das Auto-Update. Bei jedem Release beide URLs und VERSION
# auf den neuen Tag anpassen.

# Version des aktuellen Releases
VERSION=1.0.13
# Download-URL des ZIP-Archivs (von GitHub automatisch erzeugt)
ARCHIVEURL=https://github.com/timanders22/LoxBerry-Plugin-MarstekVenus/archive/refs/tags/v1.0.13.zip

# URL mit weiteren Informationen zum Release
INFOURL=https://github.com/timanders22/LoxBerry-Plugin-MarstekVenus/releases/tag/v1.0.13
